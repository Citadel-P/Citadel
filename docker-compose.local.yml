services:
  server:
    environment:
      Transport__Mode: Disabled
      Transport__PublicUrl: http://localhost:${Transport__ApiPort:-8000}
      EdgeAgent__PublicGrpcUrl: http://localhost:${Transport__EdgeGrpcPort:-8001}
      Transport__ForwardedHeaders__KnownProxies: ""
      Transport__ForwardedHeaders__KnownNetworks: ""
      Transport__ForwardedHeaders__ForwardLimit: ""
      Jwt__Issuer: http://localhost:${Transport__ApiPort:-8000}
      Jwt__Audience: http://localhost:${Transport__ApiPort:-8000}
      AgentTransport__AllowInsecure: "true"
      AllowedHosts: "localhost;127.0.0.1"
    ports:
      - "127.0.0.1:${Transport__ApiPort:-8000}:${Transport__ApiPort:-8000}"
