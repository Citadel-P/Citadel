name: Documentation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'schema/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'schema/**'
      - '.github/workflows/docs.yml'

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_DOCS_URL: ${{ vars.DOCS_SITE_URL }}
      NEXT_PUBLIC_API_DOCS_URL: ${{ vars.API_DOCS_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Validate documentation URLs
        shell: bash
        run: |
          [[ -n "${NEXT_PUBLIC_DOCS_URL}" ]] || { echo "DOCS_SITE_URL is not configured." >&2; exit 1; }
          [[ -n "${NEXT_PUBLIC_API_DOCS_URL}" ]] || { echo "API_DOCS_URL is not configured." >&2; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix docs

      - name: Validate content and links
        run: npm run validate --prefix docs

      - name: Lint documentation app
        run: npm run lint --prefix docs

      - name: Type-check documentation app
        run: npm run types:check --prefix docs

      - name: Build static documentation
        run: npm run build --prefix docs

      - name: Smoke-test static output
        run: npm run test:static --prefix docs

      - name: Build API Preview
        run: npm run build:api --prefix docs

      - name: Verify generated schema is committed
        run: git diff --exit-code -- schema

      - name: Smoke-test API Preview
        run: npm run test:api --prefix docs
