name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  schedule:
    - cron: '33 5 * * *'
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_REPOSITORY: citadel
  BUILDKIT_CACHE_SCOPE: citadel-linux-amd64
  CITADEL_E2E_IMAGE: citadel-e2e:${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.nbgv.outputs.VERSION }}
      simple-version: ${{ steps.nbgv.outputs.SIMPLE_VERSION }}
      assembly-version: ${{ steps.nbgv.outputs.ASSEMBLY_VERSION }}
      file-version: ${{ steps.nbgv.outputs.FILE_VERSION }}
      public-release: ${{ steps.nbgv.outputs.PUBLIC_RELEASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Get version from Nerdbank.GitVersioning
        id: nbgv
        shell: bash
        run: |
          {
            echo "VERSION=$(dotnet nbgv get-version -v NuGetPackageVersion)"
            echo "SIMPLE_VERSION=$(dotnet nbgv get-version -v SimpleVersion)"
            echo "ASSEMBLY_VERSION=$(dotnet nbgv get-version -v AssemblyVersion)"
            echo "FILE_VERSION=$(dotnet nbgv get-version -v AssemblyFileVersion)"
            echo "PUBLIC_RELEASE=$(dotnet nbgv get-version -v PublicRelease)"
          } >> "$GITHUB_OUTPUT"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    defaults:
      run:
        working-directory: src/Citadel.FrontEnd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Citadel.FrontEnd/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify generated API client
        run: npm run api:verify

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build:development
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test frontend
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: src/Citadel.FrontEnd/coverage
          if-no-files-found: ignore
          retention-days: 14

  e2e-smoke:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CITADEL_E2E_BASE_URL: http://127.0.0.1:18000
      COMPOSE_PROJECT_NAME: citadel-e2e-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/Citadel.Tests.E2E/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Build E2E candidate image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        with:
          context: .
          file: src/Citadel.WebApi/Dockerfile
          load: true
          tags: ${{ env.CITADEL_E2E_IMAGE }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            ASSEMBLY_VERSION=${{ needs.version.outputs.assembly-version }}
            FILE_VERSION=${{ needs.version.outputs.file-version }}
            INFORMATIONAL_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ env.BUILDKIT_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.BUILDKIT_CACHE_SCOPE }}

      - name: Install E2E dependencies
        working-directory: test/Citadel.Tests.E2E
        run: npm ci

      - name: Type-check E2E tests
        working-directory: test/Citadel.Tests.E2E
        run: npm run typecheck

      - name: Install Playwright Chromium
        working-directory: test/Citadel.Tests.E2E
        run: npx playwright install --with-deps chromium

      - name: Start isolated E2E environment
        working-directory: test/Citadel.Tests.E2E
        run: docker compose -f compose.yml up -d --wait

      - name: Run browser smoke tests
        working-directory: test/Citadel.Tests.E2E
        run: npm run test:smoke

      - name: Collect E2E environment diagnostics
        if: failure()
        working-directory: test/Citadel.Tests.E2E
        shell: bash
        run: |
          mkdir -p artifacts
          docker compose -f compose.yml ps --all > artifacts/compose-ps.txt
          docker compose -f compose.yml logs --no-color > artifacts/compose.log

      - name: Tear down isolated E2E environment
        if: always()
        working-directory: test/Citadel.Tests.E2E
        run: docker compose -f compose.yml down --volumes --remove-orphans

      - name: Export tested E2E candidate
        working-directory: test/Citadel.Tests.E2E
        shell: bash
        run: |
          mkdir -p candidate-image
          docker save "${CITADEL_E2E_IMAGE}" | gzip -1 > candidate-image/citadel-e2e-image.tar.gz

      - name: Upload tested E2E candidate
        uses: actions/upload-artifact@v4
        with:
          name: citadel-e2e-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/Citadel.Tests.E2E/candidate-image/citadel-e2e-image.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-${{ github.run_attempt }}
          path: |
            test/Citadel.Tests.E2E/artifacts
            test/Citadel.Tests.E2E/playwright-report
            test/Citadel.Tests.E2E/test-results
          if-no-files-found: ignore
          retention-days: 14

  core-runtime:
    needs: e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CITADEL_E2E_BASE_URL: http://127.0.0.1:18000
      COMPOSE_PROJECT_NAME: citadel-e2e-core-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tested E2E candidate
        uses: actions/download-artifact@v4
        with:
          name: citadel-e2e-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/Citadel.Tests.E2E/candidate-image

      - name: Load tested E2E candidate
        working-directory: test/Citadel.Tests.E2E
        shell: bash
        run: gzip -dc candidate-image/citadel-e2e-image.tar.gz | docker load

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/Citadel.Tests.E2E/package-lock.json

      - name: Install E2E dependencies
        working-directory: test/Citadel.Tests.E2E
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: test/Citadel.Tests.E2E
        run: npx playwright install --with-deps chromium

      - name: Start isolated E2E environment
        working-directory: test/Citadel.Tests.E2E
        run: docker compose -f compose.yml up -d --wait

      - name: Run core runtime tests
        working-directory: test/Citadel.Tests.E2E
        run: npm run test:core-runtime

      - name: Collect core runtime diagnostics
        if: failure()
        working-directory: test/Citadel.Tests.E2E
        shell: bash
        run: |
          mkdir -p artifacts
          docker compose -f compose.yml ps --all > artifacts/compose-ps.txt
          docker compose -f compose.yml logs --no-color > artifacts/compose.log

      - name: Tear down isolated E2E environment
        if: always()
        working-directory: test/Citadel.Tests.E2E
        run: docker compose -f compose.yml down --volumes --remove-orphans

      - name: Upload core runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-core-runtime-${{ github.run_attempt }}
          path: |
            test/Citadel.Tests.E2E/artifacts
            test/Citadel.Tests.E2E/playwright-report
            test/Citadel.Tests.E2E/test-results
          if-no-files-found: ignore
          retention-days: 14

  nightly-runtime:
    if: github.event_name == 'schedule'
    needs: e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CITADEL_E2E_BASE_URL: http://127.0.0.1:18000
      COMPOSE_PROJECT_NAME: citadel-e2e-nightly-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tested E2E candidate
        uses: actions/download-artifact@v4
        with:
          name: citadel-e2e-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/Citadel.Tests.E2E/candidate-image

      - name: Load tested E2E candidate
        working-directory: test/Citadel.Tests.E2E
        shell: bash
        run: gzip -dc candidate-image/citadel-e2e-image.tar.gz | docker load

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/Citadel.Tests.E2E/package-lock.json

      - name: Install E2E dependencies
        working-directory: test/Citadel.Tests.E2E
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: test/Citadel.Tests.E2E
        run: npx playwright install --with-deps chromium

      - name: Start isolated E2E environment
        working-directory: test/Citadel.Tests.E2E
        run: docker compose -f compose.yml up -d --wait

      - name: Run nightly runtime tests
        working-directory: test/Citadel.Tests.E2E
        run: npm run test:nightly-runtime

      - name: Collect nightly runtime diagnostics
        if: failure()
        working-directory: test/Citadel.Tests.E2E
        shell: bash
        run: |
          mkdir -p artifacts
          docker compose -f compose.yml ps --all > artifacts/compose-ps.txt
          docker compose -f compose.yml logs --no-color > artifacts/compose.log

      - name: Tear down isolated E2E environment
        if: always()
        working-directory: test/Citadel.Tests.E2E
        run: docker compose -f compose.yml down --volumes --remove-orphans

      - name: Upload nightly runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-nightly-runtime-${{ github.run_attempt }}
          path: |
            test/Citadel.Tests.E2E/artifacts
            test/Citadel.Tests.E2E/playwright-report
            test/Citadel.Tests.E2E/test-results
          if-no-files-found: ignore
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore application and test projects
        run: |
          dotnet restore src/Citadel.WebApi/Citadel.WebApi.csproj
          dotnet restore test/Citadel.Tests.Unit/Citadel.Tests.Unit.csproj
          dotnet restore test/Citadel.Tests.Integration/Citadel.Tests.Integration.csproj

      - name: Build application and test projects
        run: |
          dotnet build src/Citadel.WebApi/Citadel.WebApi.csproj --no-restore -c Release
          dotnet build test/Citadel.Tests.Unit/Citadel.Tests.Unit.csproj --no-restore -c Release
          dotnet build test/Citadel.Tests.Integration/Citadel.Tests.Integration.csproj --no-restore -c Release

      - name: Verify OpenAPI snapshots
        shell: bash
        run: |
          git diff --exit-code -- src/schema/Citadel.WebApi.json
          cmp src/schema/Citadel.WebApi.json src/Citadel.FrontEnd/src/api/schema/swagger.json

      - name: Test
        run: |
          dotnet run --project test/Citadel.Tests.Unit/Citadel.Tests.Unit.csproj --no-build -c Release
          dotnet run --project test/Citadel.Tests.Integration/Citadel.Tests.Integration.csproj --no-build -c Release

  publish:
    needs: [version, frontend, build, e2e-smoke, core-runtime]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          SIMPLE_VERSION: ${{ needs.version.outputs.simple-version }}
          PUBLIC_RELEASE: ${{ needs.version.outputs.public-release }}
        run: |
          expected_tag="v${SIMPLE_VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match version.json ('${expected_tag}')." >&2
            exit 1
          fi
          if [[ "${PUBLIC_RELEASE}" != "True" ]]; then
            echo "Release tag '${GITHUB_REF_NAME}' is not recognized by publicReleaseRefSpec." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Validate Docker Hub configuration
        shell: bash
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=()
          [[ -n "${DOCKERHUB_NAMESPACE}" ]] || missing+=("DOCKERHUB_NAMESPACE variable")
          [[ -n "${DOCKERHUB_USERNAME}" ]] || missing+=("DOCKERHUB_USERNAME variable")
          [[ -n "${DOCKERHUB_TOKEN}" ]] || missing+=("DOCKERHUB_TOKEN secret")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing Docker Hub configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Log into GitHub Container Registry
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.ACCESS_TOKEN }}

      - name: Log into Docker Hub
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: |
            name=${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
            name=docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${{ env.DOCKERHUB_REPOSITORY }},enable=${{ vars.DOCKERHUB_NAMESPACE != '' }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=Docker image for ${{ env.IMAGE_NAME }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        with:
          context: .
          file: src/Citadel.WebApi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            ASSEMBLY_VERSION=${{ needs.version.outputs.assembly-version }}
            FILE_VERSION=${{ needs.version.outputs.file-version }}
            INFORMATIONAL_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ env.BUILDKIT_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.BUILDKIT_CACHE_SCOPE }}

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] && cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"
