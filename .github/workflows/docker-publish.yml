name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  workflow_dispatch:
    inputs:
      edge_core_image:
        description: Optional exact Core image reference to test instead of building this revision
        required: false
        type: string
      edge_agent_image:
        description: Optional exact Agent image reference to test instead of building Citadel.Agent
        required: false
        type: string
      edge_agent_ref:
        description: Agent Git ref to build; defaults to the matching stable tag or main
        required: false
        type: string
      edge_agent_version:
        description: Expected Agent version when edge_agent_image is supplied
        required: false
        type: string
  schedule:
    - cron: '33 5 * * *'
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_REPOSITORY: citadel
  BUILDKIT_CACHE_SCOPE: citadel-linux-amd64
  CITADEL_E2E_IMAGE: citadel-e2e:${{ github.run_id }}-${{ github.run_attempt }}
  CITADEL_EDGE_CORE_TEST_IMAGE: citadel-edge-core:${{ github.run_id }}-${{ github.run_attempt }}
  CITADEL_EDGE_AGENT_TEST_IMAGE: citadel-edge-agent:${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.nbgv.outputs.VERSION }}
      simple-version: ${{ steps.nbgv.outputs.SIMPLE_VERSION }}
      assembly-version: ${{ steps.nbgv.outputs.ASSEMBLY_VERSION }}
      file-version: ${{ steps.nbgv.outputs.FILE_VERSION }}
      public-release: ${{ steps.nbgv.outputs.PUBLIC_RELEASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Get version from Nerdbank.GitVersioning
        id: nbgv
        shell: bash
        run: |
          {
            echo "VERSION=$(dotnet nbgv get-version -v NuGetPackageVersion)"
            echo "SIMPLE_VERSION=$(dotnet nbgv get-version -v SimpleVersion)"
            echo "ASSEMBLY_VERSION=$(dotnet nbgv get-version -v AssemblyVersion)"
            echo "FILE_VERSION=$(dotnet nbgv get-version -v AssemblyFileVersion)"
            echo "PUBLIC_RELEASE=$(dotnet nbgv get-version -v PublicRelease)"
          } >> "$GITHUB_OUTPUT"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    defaults:
      run:
        working-directory: src/Citadel.FrontEnd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Citadel.FrontEnd/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify generated API client
        run: npm run api:verify

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build:development
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test frontend
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: src/Citadel.FrontEnd/coverage
          if-no-files-found: ignore
          retention-days: 14

  e2e-smoke:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CITADEL_E2E_BASE_URL: http://127.0.0.1:18000
      COMPOSE_PROJECT_NAME: citadel-e2e-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/Citadel.Tests.E2E/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Build E2E candidate image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        with:
          context: .
          file: src/Citadel.WebApi/Dockerfile
          load: true
          tags: ${{ env.CITADEL_E2E_IMAGE }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            ASSEMBLY_VERSION=${{ needs.version.outputs.assembly-version }}
            FILE_VERSION=${{ needs.version.outputs.file-version }}
            INFORMATIONAL_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ env.BUILDKIT_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.BUILDKIT_CACHE_SCOPE }}

      - name: Install E2E dependencies
        working-directory: test/Citadel.Tests.E2E
        run: npm ci

      - name: Type-check E2E tests
        working-directory: test/Citadel.Tests.E2E
        run: npm run typecheck

      - name: Install Playwright Chromium
        working-directory: test/Citadel.Tests.E2E
        run: npx playwright install --with-deps chromium

      - name: Start isolated E2E environment
        working-directory: test/Citadel.Tests.E2E
        run: docker compose -f compose.yml up -d --wait

      - name: Run browser smoke tests
        working-directory: test/Citadel.Tests.E2E
        run: npm run test:smoke

      - name: Collect E2E environment diagnostics
        if: failure()
        working-directory: test/Citadel.Tests.E2E
        shell: bash
        run: |
          mkdir -p artifacts
          docker compose -f compose.yml ps --all > artifacts/compose-ps.txt
          docker compose -f compose.yml logs --no-color > artifacts/compose.log

      - name: Tear down isolated E2E environment
        if: always()
        working-directory: test/Citadel.Tests.E2E
        run: docker compose -f compose.yml down --volumes --remove-orphans

      - name: Export tested E2E candidate
        working-directory: test/Citadel.Tests.E2E
        shell: bash
        run: |
          mkdir -p candidate-image
          docker save "${CITADEL_E2E_IMAGE}" | gzip -1 > candidate-image/citadel-e2e-image.tar.gz

      - name: Upload tested E2E candidate
        uses: actions/upload-artifact@v4
        with:
          name: citadel-e2e-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/Citadel.Tests.E2E/candidate-image/citadel-e2e-image.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-${{ github.run_attempt }}
          path: |
            test/Citadel.Tests.E2E/artifacts
            test/Citadel.Tests.E2E/playwright-report
            test/Citadel.Tests.E2E/test-results
          if-no-files-found: ignore
          retention-days: 14

  core-runtime:
    needs: e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CITADEL_E2E_BASE_URL: http://127.0.0.1:18000
      COMPOSE_PROJECT_NAME: citadel-e2e-core-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tested E2E candidate
        uses: actions/download-artifact@v4
        with:
          name: citadel-e2e-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/Citadel.Tests.E2E/candidate-image

      - name: Load tested E2E candidate
        working-directory: test/Citadel.Tests.E2E
        shell: bash
        run: gzip -dc candidate-image/citadel-e2e-image.tar.gz | docker load

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/Citadel.Tests.E2E/package-lock.json

      - name: Install E2E dependencies
        working-directory: test/Citadel.Tests.E2E
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: test/Citadel.Tests.E2E
        run: npx playwright install --with-deps chromium

      - name: Start isolated E2E environment
        working-directory: test/Citadel.Tests.E2E
        run: docker compose -f compose.yml up -d --wait

      - name: Run core runtime tests
        working-directory: test/Citadel.Tests.E2E
        run: npm run test:core-runtime

      - name: Collect core runtime diagnostics
        if: failure()
        working-directory: test/Citadel.Tests.E2E
        shell: bash
        run: |
          mkdir -p artifacts
          docker compose -f compose.yml ps --all > artifacts/compose-ps.txt
          docker compose -f compose.yml logs --no-color > artifacts/compose.log

      - name: Tear down isolated E2E environment
        if: always()
        working-directory: test/Citadel.Tests.E2E
        run: docker compose -f compose.yml down --volumes --remove-orphans

      - name: Upload core runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-core-runtime-${{ github.run_attempt }}
          path: |
            test/Citadel.Tests.E2E/artifacts
            test/Citadel.Tests.E2E/playwright-report
            test/Citadel.Tests.E2E/test-results
          if-no-files-found: ignore
          retention-days: 14

  nightly-runtime:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CITADEL_E2E_BASE_URL: http://127.0.0.1:18000
      COMPOSE_PROJECT_NAME: citadel-e2e-nightly-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tested E2E candidate
        uses: actions/download-artifact@v4
        with:
          name: citadel-e2e-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/Citadel.Tests.E2E/candidate-image

      - name: Load tested E2E candidate
        working-directory: test/Citadel.Tests.E2E
        shell: bash
        run: gzip -dc candidate-image/citadel-e2e-image.tar.gz | docker load

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/Citadel.Tests.E2E/package-lock.json

      - name: Install E2E dependencies
        working-directory: test/Citadel.Tests.E2E
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: test/Citadel.Tests.E2E
        run: npx playwright install --with-deps chromium

      - name: Start isolated E2E environment
        working-directory: test/Citadel.Tests.E2E
        run: docker compose -f compose.yml up -d --wait

      - name: Run nightly runtime tests
        working-directory: test/Citadel.Tests.E2E
        run: npm run test:nightly-runtime

      - name: Collect nightly runtime diagnostics
        if: failure()
        working-directory: test/Citadel.Tests.E2E
        shell: bash
        run: |
          mkdir -p artifacts
          docker compose -f compose.yml ps --all > artifacts/compose-ps.txt
          docker compose -f compose.yml logs --no-color > artifacts/compose.log

      - name: Tear down isolated E2E environment
        if: always()
        working-directory: test/Citadel.Tests.E2E
        run: docker compose -f compose.yml down --volumes --remove-orphans

      - name: Upload nightly runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-nightly-runtime-${{ github.run_attempt }}
          path: |
            test/Citadel.Tests.E2E/artifacts
            test/Citadel.Tests.E2E/playwright-report
            test/Citadel.Tests.E2E/test-results
          if-no-files-found: ignore
          retention-days: 14

  visual-regression:
    name: Browser / visual regression
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CITADEL_E2E_BASE_URL: http://127.0.0.1:18000
      COMPOSE_PROJECT_NAME: citadel-e2e-visual-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tested E2E candidate
        uses: actions/download-artifact@v4
        with:
          name: citadel-e2e-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/Citadel.Tests.E2E/candidate-image

      - name: Load tested E2E candidate
        working-directory: test/Citadel.Tests.E2E
        shell: bash
        run: gzip -dc candidate-image/citadel-e2e-image.tar.gz | docker load

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/Citadel.Tests.E2E/package-lock.json

      - name: Install E2E dependencies
        working-directory: test/Citadel.Tests.E2E
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: test/Citadel.Tests.E2E
        run: npx playwright install --with-deps chromium

      - name: Start isolated visual environment
        working-directory: test/Citadel.Tests.E2E
        run: docker compose -f compose.yml up -d --wait

      - name: Run visual regression tests
        working-directory: test/Citadel.Tests.E2E
        run: npm run test:visual

      - name: Collect visual regression diagnostics
        if: failure()
        working-directory: test/Citadel.Tests.E2E
        shell: bash
        run: |
          mkdir -p artifacts
          docker compose -f compose.yml ps --all > artifacts/compose-ps.txt
          docker compose -f compose.yml logs --no-color > artifacts/compose.log

      - name: Tear down isolated visual environment
        if: always()
        working-directory: test/Citadel.Tests.E2E
        run: docker compose -f compose.yml down --volumes --remove-orphans

      - name: Upload visual regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-visual-regression-${{ github.run_attempt }}
          path: |
            test/Citadel.Tests.E2E/artifacts
            test/Citadel.Tests.E2E/playwright-report
            test/Citadel.Tests.E2E/test-results
          if-no-files-found: ignore
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore application and test projects
        run: |
          dotnet restore src/Citadel.WebApi/Citadel.WebApi.csproj
          dotnet restore test/Citadel.Tests.Unit/Citadel.Tests.Unit.csproj
          dotnet restore test/Citadel.Tests.Integration/Citadel.Tests.Integration.csproj

      - name: Build application and test projects
        run: |
          dotnet build src/Citadel.WebApi/Citadel.WebApi.csproj --no-restore -c Release
          dotnet build test/Citadel.Tests.Unit/Citadel.Tests.Unit.csproj --no-restore -c Release
          dotnet build test/Citadel.Tests.Integration/Citadel.Tests.Integration.csproj --no-restore -c Release

      - name: Verify OpenAPI snapshots
        shell: bash
        run: |
          git diff --exit-code -- src/schema/Citadel.WebApi.json
          cmp src/schema/Citadel.WebApi.json src/Citadel.FrontEnd/src/api/schema/swagger.json

      - name: Test
        run: |
          dotnet run --project test/Citadel.Tests.Unit/Citadel.Tests.Unit.csproj --no-build -c Release
          dotnet run --project test/Citadel.Tests.Integration/Citadel.Tests.Integration.csproj --no-build -c Release

  nightly-matrix:
    name: Nightly / ${{ matrix.suite }}
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: reliability
            classes: >-
              -class Tests.Integration.Application.Features.Stacks.StackApplyRecoveryTests
              -class Tests.Integration.Application.TaskJobs.ReconcilableResourceJobTests
          - suite: scheduler-webhook
            classes: >-
              -class Tests.Integration.Application.TaskJobs.BackupPolicySchedulerJobTests
              -class Tests.Integration.Application.TaskJobs.AutomationActionSchedulerJobTests
              -class Tests.Integration.WebApi.WebhookListenerTests
          - suite: licensing
            classes: >-
              -class Tests.Integration.Application.Features.Licensing.LicenseEntitlementTests
          - suite: authorization
            classes: >-
              -class Tests.Integration.Application.Features.Identity.Roles.RolePermissionMatrixTests
              -class Tests.Integration.Application.Features.Permissions.HasPermissionForAllIntegrationTests
              -class Tests.Integration.Application.Features.Lookup.LookupTests
              -class Tests.Integration.Application.Features.Search.GlobalSearchTests
              -class Tests.Integration.WebApi.Hubs.ApplicationHubAuthorizationTests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Preload integration test infrastructure
        shell: bash
        run: >-
          bash .github/scripts/pull-images-with-retry.sh
          testcontainers/ryuk:0.14.0
          postgres:17.5-alpine

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore nightly integration tests
        run: dotnet restore test/Citadel.Tests.Integration/Citadel.Tests.Integration.csproj

      - name: Build nightly integration tests
        run: dotnet build test/Citadel.Tests.Integration/Citadel.Tests.Integration.csproj --no-restore -c Release

      - name: Run ${{ matrix.suite }} acceptance cohort
        shell: bash
        env:
          TEST_CLASSES: ${{ matrix.classes }}
        run: |
          set -o pipefail
          read -r -a class_filters <<< "${TEST_CLASSES}"
          mkdir -p "test/Citadel.Tests.Integration/artifacts/${{ matrix.suite }}"
          dotnet run \
            --project test/Citadel.Tests.Integration/Citadel.Tests.Integration.csproj \
            --no-build \
            -c Release \
            -- \
            "${class_filters[@]}" \
            2>&1 | tee "test/Citadel.Tests.Integration/artifacts/${{ matrix.suite }}/test-output.log"

      - name: Collect ${{ matrix.suite }} diagnostics
        if: failure()
        shell: bash
        run: |
          artifact_dir="test/Citadel.Tests.Integration/artifacts/${{ matrix.suite }}"
          mkdir -p "${artifact_dir}"
          docker ps --all > "${artifact_dir}/docker-ps.txt"
          docker images --digests > "${artifact_dir}/docker-images.txt"
          for container in $(docker ps --all --quiet); do
            docker inspect "${container}" > "${artifact_dir}/${container}.inspect.json" 2>&1 || true
            docker logs "${container}" > "${artifact_dir}/${container}.log" 2>&1 || true
          done

      - name: Upload ${{ matrix.suite }} diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.suite }}-${{ github.run_attempt }}
          path: test/Citadel.Tests.Integration/artifacts/${{ matrix.suite }}
          if-no-files-found: ignore
          retention-days: 14

  upgrade-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Preload Testcontainers infrastructure
        shell: bash
        run: >-
          bash .github/scripts/pull-images-with-retry.sh
          testcontainers/ryuk:0.14.0
          postgres:17.5-alpine

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore upgrade acceptance tests
        run: dotnet restore test/Citadel.Tests.Acceptance/Citadel.Tests.Acceptance.csproj

      - name: Build upgrade acceptance tests
        run: dotnet build test/Citadel.Tests.Acceptance/Citadel.Tests.Acceptance.csproj --no-restore -c Release

      - name: Run pre-release upgrade baseline
        run: dotnet run --project test/Citadel.Tests.Acceptance/Citadel.Tests.Acceptance.csproj --no-build -c Release -- -class Tests.Acceptance.Upgrades.PreReleaseUpgradeTests

      - name: Collect upgrade acceptance diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p test/Citadel.Tests.Acceptance/artifacts
          docker ps --all > test/Citadel.Tests.Acceptance/artifacts/docker-ps.txt
          for container in $(docker ps --all --quiet); do
            docker logs "${container}" > "test/Citadel.Tests.Acceptance/artifacts/${container}.log" 2>&1 || true
          done

      - name: Upload upgrade acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-baseline-${{ github.run_attempt }}
          path: test/Citadel.Tests.Acceptance/artifacts
          if-no-files-found: ignore
          retention-days: 14

  control-plane-recovery:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Preload Testcontainers infrastructure
        shell: bash
        run: >-
          bash .github/scripts/pull-images-with-retry.sh
          testcontainers/ryuk:0.14.0
          postgres:17.5-alpine

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore control-plane recovery acceptance tests
        run: dotnet restore test/Citadel.Tests.Acceptance/Citadel.Tests.Acceptance.csproj

      - name: Build control-plane recovery acceptance tests
        run: dotnet build test/Citadel.Tests.Acceptance/Citadel.Tests.Acceptance.csproj --no-restore -c Release

      - name: Run control-plane backup and restore
        run: dotnet run --project test/Citadel.Tests.Acceptance/Citadel.Tests.Acceptance.csproj --no-build -c Release -- -class Tests.Acceptance.Recovery.ControlPlaneRecoveryTests

      - name: Collect recovery acceptance diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p test/Citadel.Tests.Acceptance/artifacts
          docker ps --all > test/Citadel.Tests.Acceptance/artifacts/docker-ps.txt
          for container in $(docker ps --all --quiet); do
            docker logs "${container}" > "test/Citadel.Tests.Acceptance/artifacts/${container}.log" 2>&1 || true
          done

      - name: Upload recovery acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-recovery-${{ github.run_attempt }}
          path: test/Citadel.Tests.Acceptance/artifacts
          if-no-files-found: ignore
          retention-days: 14

  edge-agent-recovery:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Preload Testcontainers infrastructure
        shell: bash
        run: >-
          bash .github/scripts/pull-images-with-retry.sh
          testcontainers/ryuk:0.14.0
          postgres:17.5-alpine

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Edge Agent recovery acceptance tests
        run: dotnet restore test/Citadel.Tests.Acceptance/Citadel.Tests.Acceptance.csproj

