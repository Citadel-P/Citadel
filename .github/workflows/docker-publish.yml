  publish:
    needs: [version, frontend, build, e2e-smoke, core-runtime, upgrade-baseline, control-plane-recovery, edge-agent-recovery, git-webhook, edge-agent-compatibility, backups-s3, oidc, vault]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          SIMPLE_VERSION: ${{ needs.version.outputs.simple-version }}
          PUBLIC_RELEASE: ${{ needs.version.outputs.public-release }}
        run: |
          expected_tag="v${SIMPLE_VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match version.json ('${expected_tag}')." >&2
            exit 1
          fi
          if [[ "${PUBLIC_RELEASE}" != "True" ]]; then
            echo "Release tag '${GITHUB_REF_NAME}' is not recognized by publicReleaseRefSpec." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Validate Docker Hub configuration
        shell: bash
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=()
          [[ -n "${DOCKERHUB_NAMESPACE}" ]] || missing+=("DOCKERHUB_NAMESPACE variable")
          [[ -n "${DOCKERHUB_USERNAME}" ]] || missing+=("DOCKERHUB_USERNAME variable")
          [[ -n "${DOCKERHUB_TOKEN}" ]] || missing+=("DOCKERHUB_TOKEN secret")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing Docker Hub configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Log into GitHub Container Registry
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.ACCESS_TOKEN }}

      - name: Log into Docker Hub
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: |
            name=${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
            name=docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${{ env.DOCKERHUB_REPOSITORY }},enable=${{ vars.DOCKERHUB_NAMESPACE != '' }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=Docker image for ${{ env.IMAGE_NAME }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        with:
          context: .
          file: src/Citadel.WebApi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            ASSEMBLY_VERSION=${{ needs.version.outputs.assembly-version }}
            FILE_VERSION=${{ needs.version.outputs.file-version }}
            INFORMATIONAL_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ env.BUILDKIT_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.BUILDKIT_CACHE_SCOPE }}

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] && cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"
