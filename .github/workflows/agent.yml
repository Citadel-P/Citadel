name: Core and Agent candidates

on:
  workflow_call:
    inputs:
      release:
        required: true
        type: boolean
      dockerhub_username:
        required: false
        type: string
        default: ''
    secrets:
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  candidate:
    name: Tested Core and Agent linux/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      SQLX_OFFLINE: 'true'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      DOCKERHUB_USERNAME: ${{ inputs.dockerhub_username }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused SDK space on disposable hosted runners
        run: |
          if [[ "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          fi
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: ${{ runner.temp }}/candidates
      - name: Install test and OCI transport tools
        run: |
          bash .github/scripts/install-packages.sh pkg-config libssl-dev ripgrep skopeo
          echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "CITADEL_AGENT_COMPATIBILITY_CACHE_DIR=$RUNNER_TEMP/citadel-compatibility-target" >> "$GITHUB_ENV"
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: candidate-${{ matrix.arch }}
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Recover durable candidates on a release retry
        if: inputs.release
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 src/tools/release/release.py recover --repository "$GITHUB_REPOSITORY" \
            --metadata "$RUNNER_TEMP/candidates/version.json" --directory "$RUNNER_TEMP/candidates" \
            --artifact candidates-${{ matrix.arch }} \
            > "$RUNNER_TEMP/recovery.json"
          echo "recovered=$(jq -r .recovered "$RUNNER_TEMP/recovery.json")" >> "$GITHUB_OUTPUT"
      - name: Authenticate released baseline reads
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Read shared metadata
        id: version
        run: |
          python3 - "$RUNNER_TEMP/candidates/version.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          with open(sys.argv[2], 'a') as output:
              for key in ['productVersion','displayVersion','informationalVersion','sourceRevision']:
                  output.write(f'{key}={data[key]}\n')
          PY
      - name: Validate Agent and transport components
        run: |
          cargo fmt -p citadel-agent -p citadel-contracts -p citadel-volume-helper -- --check
          cargo clippy --locked -p citadel-agent -p citadel-contracts -p citadel-volume-helper --all-targets -- -D warnings
          cargo test --locked -p citadel-agent -p citadel-contracts -p citadel-volume-helper
          cargo test --locked -p citadel-adapters --test agent_mutations --test edge_sessions
          cargo test --locked -p citadel-adapters --lib connectors::agent::execution::tests
      - name: Authenticate Docker Hub pulls
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        id: buildx
      - name: Cache Docker Cargo mounts
        if: steps.recovery.outputs.recovered != 'true'
        uses: actions/cache@v4
        id: docker-cargo-cache
        with:
          path: ${{ runner.temp }}/citadel-docker-cargo
          key: docker-cargo-v1-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'Dockerfile.agent', 'rust-toolchain.toml', '.cargo/config.toml', '**/Cargo.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            docker-cargo-v1-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'Dockerfile.agent', 'rust-toolchain.toml', '.cargo/config.toml', '**/Cargo.toml', 'Cargo.lock') }}-
      # Registered after actions/cache so extraction runs before the cache is saved.
      - name: Restore and retain Docker Cargo mounts
        if: steps.recovery.outputs.recovered != 'true'
        uses: reproducible-containers/buildkit-cache-dance@5b81f4d29dc8397a7d341dba3aeecc7ec54d6361 # v3.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          scratch-dir: ${{ runner.temp }}/citadel-cache-dance
          skip-extraction: ${{ steps.docker-cargo-cache.outputs.cache-hit }}
          utility-image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          cache-map: |
            {
              "${{ runner.temp }}/citadel-docker-cargo/registry": {"target": "/usr/local/cargo/registry", "id": "citadel-rust-registry", "sharing": "locked"},
              "${{ runner.temp }}/citadel-docker-cargo/git": {"target": "/usr/local/cargo/git", "id": "citadel-rust-git", "sharing": "locked"},
              "${{ runner.temp }}/citadel-docker-cargo/release": {"target": "/source/target", "id": "citadel-rust-target", "sharing": "locked"},
              "${{ runner.temp }}/citadel-docker-cargo/volume-helper": {"target": "/source/target", "id": "citadel-volume-helper-target", "sharing": "locked"}
            }
      - name: Build Agent candidate once
        if: steps.recovery.outputs.recovered != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/candidates/agent-${{ matrix.arch }}.oci.tar
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.version.outputs.displayVersion }}
            INFORMATIONAL_VERSION=${{ steps.version.outputs.informationalVersion }}
            SOURCE_REVISION=${{ steps.version.outputs.sourceRevision }}
            PRODUCT_VERSION=${{ steps.version.outputs.productVersion }}
          cache-from: type=gha,scope=agent-${{ matrix.arch }}
          cache-to: type=gha,scope=agent-${{ matrix.arch }},mode=max
      - name: Build Core candidate once
        if: steps.recovery.outputs.recovered != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/candidates/core-${{ matrix.arch }}.oci.tar
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.version.outputs.displayVersion }}
            INFORMATIONAL_VERSION=${{ steps.version.outputs.informationalVersion }}
            SOURCE_REVISION=${{ steps.version.outputs.sourceRevision }}
            PRODUCT_VERSION=${{ steps.version.outputs.productVersion }}
          cache-from: type=gha,scope=core-${{ matrix.arch }}
          cache-to: type=gha,scope=core-${{ matrix.arch }},mode=max
      - name: Cache pinned-builder compatibility compilation
        uses: actions/cache@v4
        with:
          path: ${{ env.CITADEL_AGENT_COMPATIBILITY_CACHE_DIR }}
          key: agent-compat-v1-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Dockerfile.agent', 'rust-toolchain.toml', '.cargo/config.toml', '**/Cargo.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            agent-compat-v1-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Dockerfile.agent', 'rust-toolchain.toml', '.cargo/config.toml', '**/Cargo.toml', 'Cargo.lock') }}-
      - name: Exercise exact candidates and supported upgrade directions
        run: python3 src/tools/release/candidates.py --directory "$RUNNER_TEMP/candidates" --arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: candidates-${{ matrix.arch }}
          overwrite: true
          path: |
            ${{ runner.temp }}/candidates/agent-${{ matrix.arch }}.oci.tar
            ${{ runner.temp }}/candidates/core-${{ matrix.arch }}.oci.tar
            ${{ runner.temp }}/candidates/evidence-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30
