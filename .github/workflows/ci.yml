name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-openapi:
    name: Rust validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    env:
      SQLX_OFFLINE: "true"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_INCREMENTAL: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Rust build prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev ripgrep

      - name: Verify Rust source ownership
        run: bash scripts/check-source-ownership.sh

      - name: Verify Docker build context isolation
        run: |
          set -euo pipefail
          tar --exclude=rust/target --exclude=rust/artifacts -C .. -c rust version.json \
            | docker build --file rust/Dockerfile --target rust-source -

      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal

      - name: Set up Java for pinned Docker API generation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify generated Docker API crate
        run: cargo run --locked -p xtask -- docker-api --check

      - name: Verify database schema
        run: cargo run --locked -p xtask -- database verify

      - name: Verify committed OpenAPI artifacts
        run: cargo run --locked -p xtask -- openapi --check

      - name: Check Rust workspace without external contracts
        run: cargo check --locked --workspace

      - name: Check Rust formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run Rust workspace tests
        run: cargo test --locked --workspace

      - name: Run authorization and runtime database regressions
        run: |
          set -euo pipefail
          container=citadel-authorization-postgres
          trap 'docker rm -f -v "$container" >/dev/null' EXIT
          docker run --detach --name "$container" \
            --publish 127.0.0.1::5432 \
            --env POSTGRES_USER=citadel_test \
            --env POSTGRES_PASSWORD=citadel_test \
            --env POSTGRES_DB=citadel_authorization \
            postgres@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44 \
            -c shared_preload_libraries=pg_stat_statements
          for _ in {1..60}; do
            if docker exec "$container" pg_isready -h 127.0.0.1 -U citadel_test -d citadel_authorization; then
              break
            fi
            sleep 1
          done
          docker exec "$container" psql -h 127.0.0.1 -U citadel_test -d citadel_authorization \
            -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pg_stat_statements'
          port=$(docker port "$container" 5432/tcp | cut -d: -f2)
          export CITADEL_PHASE6_DATABASE_URL="postgres://citadel_test:citadel_test@127.0.0.1:$port/citadel_authorization"
          export CITADEL_PHASE3_DATABASE_URL="$CITADEL_PHASE6_DATABASE_URL"
          export CITADEL_PHASE4_DATABASE_URL="$CITADEL_PHASE6_DATABASE_URL"
          export CITADEL_PHASE7_DATABASE_URL="$CITADEL_PHASE6_DATABASE_URL"
          export CITADEL_REQUIRE_QUERY_COUNTS=1
          cargo test --locked -p citadel-server --test deployments_http \
            deployment_endpoints_enforce_auth_and_persist_the_crud_lifecycle -- --ignored --exact --nocapture
          cargo test --locked -p citadel-adapters --test identity_authorization_differential -- --ignored --test-threads=1
          cargo test --locked -p citadel-adapters --test deployment_apply_persistence -- --ignored --test-threads=1
          cargo test --locked -p citadel-adapters --test stack_persistence --test platform_inventory_persistence -- --ignored --test-threads=1
          cargo test --locked -p citadel-server --test platforms_http node_coverage -- --ignored --test-threads=1
          cargo test --locked -p citadel-adapters --test edge_transport -- --ignored --test-threads=1

  backend-tests:
    name: Backend unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN || github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Restore tests
        run: |
          dotnet restore test/Citadel.Tests.Unit/Citadel.Tests.Unit.csproj
          dotnet restore test/Citadel.Tests.Integration/Citadel.Tests.Integration.csproj

      - name: Build tests
        run: |
          dotnet build test/Citadel.Tests.Unit/Citadel.Tests.Unit.csproj --no-restore -c Release -p:OpenApiGenerateDocumentsOnBuild=false
          dotnet build test/Citadel.Tests.Integration/Citadel.Tests.Integration.csproj --no-restore -c Release -p:OpenApiGenerateDocumentsOnBuild=false

      - name: Run backend unit tests
        run: dotnet run --project test/Citadel.Tests.Unit/Citadel.Tests.Unit.csproj --no-build -c Release

      - name: Run backend integration tests
        run: dotnet run --project test/Citadel.Tests.Integration/Citadel.Tests.Integration.csproj --no-build -c Release

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: src/Citadel.FrontEnd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Citadel.FrontEnd/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:run

  release-image:
    name: Publish release image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [backend-tests, frontend-tests, rust-openapi]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN || github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag '${GITHUB_REF_NAME}' does not point to a commit on main." >&2
            exit 1
          fi

          dotnet tool restore
          version="$(dotnet nbgv get-version -v NuGetPackageVersion)"
          simple_version="$(dotnet nbgv get-version -v SimpleVersion)"
          assembly_version="$(dotnet nbgv get-version -v AssemblyVersion)"
          file_version="$(dotnet nbgv get-version -v AssemblyFileVersion)"
          public_release="$(dotnet nbgv get-version -v PublicRelease)"

          if [[ "${GITHUB_REF_NAME}" != "v${simple_version}" ]]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match version.json ('v${simple_version}')." >&2
            exit 1
          fi
          if [[ "${public_release}" != "True" ]]; then
            echo "Release tag '${GITHUB_REF_NAME}' is not recognized as a public release." >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "assembly-version=${assembly_version}"
            echo "file-version=${file_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate Docker Hub configuration
        shell: bash
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [[ -n "${DOCKERHUB_NAMESPACE}" ]] || { echo "DOCKERHUB_NAMESPACE is not configured." >&2; exit 1; }
          [[ -n "${DOCKERHUB_USERNAME}" ]] || { echo "DOCKERHUB_USERNAME is not configured." >&2; exit 1; }
          [[ -n "${DOCKERHUB_TOKEN}" ]] || { echo "DOCKERHUB_TOKEN is not configured." >&2; exit 1; }

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/citadel
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}

      - name: Build and publish release image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Citadel.WebApi/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            ASSEMBLY_VERSION=${{ steps.version.outputs.assembly-version }}
            FILE_VERSION=${{ steps.version.outputs.file-version }}
            INFORMATIONAL_VERSION=${{ steps.version.outputs.version }}

      - name: Verify published image aliases
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            remote_digest="$(docker buildx imagetools inspect "${tag}" --format '{{.Manifest.Digest}}')"
            if [[ "${remote_digest}" != "${DIGEST}" ]]; then
              echo "Published alias '${tag}' resolved to '${remote_digest}', expected '${DIGEST}'." >&2
              exit 1
            fi
          done <<< "${TAGS}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign published image
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] && cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"

          {
            echo "### Published Citadel ${GITHUB_REF_NAME}"
            echo
            echo "- Manifest digest: \`${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  release-documentation:
    name: Build release documentation
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release-image]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_DOCS_URL: ${{ vars.DOCS_SITE_URL }}
      NEXT_PUBLIC_API_DOCS_URL: ${{ vars.API_DOCS_URL }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN || github.token }}

      - name: Validate documentation URLs
        shell: bash
        run: |
          [[ -n "${NEXT_PUBLIC_DOCS_URL}" ]] || { echo "DOCS_SITE_URL is not configured." >&2; exit 1; }
          [[ -n "${NEXT_PUBLIC_API_DOCS_URL}" ]] || { echo "API_DOCS_URL is not configured." >&2; exit 1; }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Restore backend
        run: dotnet restore src/Citadel.WebApi/Citadel.WebApi.csproj

      - name: Install documentation dependencies
        run: npm ci --prefix docs

      - name: Build product documentation
        run: |
          npm run validate --prefix docs
          npm run lint --prefix docs
          npm run types:check --prefix docs
          npm run build --prefix docs
          npm run test:static --prefix docs

      - name: Build API Preview
        run: |
          npm run build:api --prefix docs
          git diff --exit-code -- src/schema
          npm run test:api --prefix docs

      - name: Upload product documentation for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

      - name: Upload independent API Preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: citadel-api-docs-${{ github.ref_name }}
          path: docs/api-out
          if-no-files-found: error
          retention-days: 90

  deploy-documentation:
    name: Publish release documentation
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release-documentation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy product documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
