name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  version:
    name: Resolve identity and release preflight
    permissions:
      contents: write # Reserve internal recovery storage on validated tag pushes only.
      packages: read
      actions: read
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    outputs:
      release: ${{ steps.version.outputs.releaseEligible }}
      product: ${{ steps.version.outputs.productVersion }}
      publication: ${{ steps.version.outputs.publicationEligible }}
      completed: ${{ steps.preflight.outputs.completed }}
      development: ${{ steps.version.outputs.developmentReleaseEligible }}
      display: ${{ steps.version.outputs.displayVersion }}
      revision: ${{ steps.version.outputs.sourceRevision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install native tooling prerequisites
        run: bash .github/scripts/install-packages.sh pkg-config libssl-dev skopeo
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/citadel-tools
          key: nbgv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/tools/build/nbgv-pin.json', 'src/tools/release/git-cliff-pin.json', 'rust-toolchain.toml') }}
      - name: Install and verify pinned native NBGV
        run: python3 src/tools/build/version.py install
      - name: Resolve build identity once
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          # checkout may replace the annotated tag ref with the event commit.
          # Restore origin's tag objects in this disposable checkout before validation.
          git fetch origin +refs/heads/main:refs/remotes/origin/main '+refs/tags/*:refs/tags/*'
          mkdir -p "$RUNNER_TEMP/release-inputs"
          python3 src/tools/build/version.py resolve --event "$EVENT" --ref "$REF" --sha "$SHA" \
            --output "$RUNNER_TEMP/release-inputs/version.json" --github-output "$GITHUB_OUTPUT"
      - name: Authenticate Docker Hub preflight pulls
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Pull OCI transport registry fixture with retries
        run: bash .github/scripts/pull-images-with-retry.sh registry@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
      - name: Install checksum-pinned git-cliff
        run: python3 src/tools/release/notes.py install
      - name: Check version mapping and embedding
        run: CITADEL_TEST_OCI_TRANSPORT=1 python3 -m unittest discover -s test/release -v
      - name: Validate coordinated publication prerequisites
        id: preflight
        if: steps.version.outputs.publicationEligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CITADEL_RUST_AGENT_RELEASE_ENABLED: ${{ vars.CITADEL_RUST_AGENT_RELEASE_ENABLED }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
          API_DOCS_URL: ${{ vars.API_DOCS_URL }}
        run: |
          python3 src/tools/release/release.py preflight --repository "$GITHUB_REPOSITORY" \
            --metadata "$RUNNER_TEMP/release-inputs/version.json" --directory "$RUNNER_TEMP/release-inputs"
          python3 src/tools/release/release.py prepare --apply --repository "$GITHUB_REPOSITORY" \
            --metadata "$RUNNER_TEMP/release-inputs/version.json" --directory "$RUNNER_TEMP/release-inputs" \
            > "$RUNNER_TEMP/publication-state.json"
          echo "completed=$(jq -r .completed "$RUNNER_TEMP/publication-state.json")" >> "$GITHUB_OUTPUT"
      - name: Generate tagged release notes with pinned git-cliff
        if: steps.version.outputs.publicationEligible == 'true' && steps.preflight.outputs.completed != 'true'
        env:
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: |
          python3 src/tools/release/notes.py generate --metadata "$RUNNER_TEMP/release-inputs/version.json" \
            --directory "$RUNNER_TEMP/release-inputs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-inputs
          overwrite: true
          path: ${{ runner.temp }}/release-inputs
          if-no-files-found: error
          retention-days: 30

  rust-checks:
    if: needs.version.outputs.completed != 'true'
    needs: version
    name: Rust lint and generated contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    env:
      SQLX_OFFLINE: "true"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_INCREMENTAL: "false"
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - name: Install Rust build prerequisites
        run: |
          bash .github/scripts/install-packages.sh pkg-config libssl-dev ripgrep
          echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - name: Authenticate Docker Hub pulls
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Verify Rust source ownership
        run: bash test/scripts/check-source-ownership.sh

      - name: Verify Docker build context isolation
        run: |
          set -euo pipefail
          tar -c Cargo.toml Cargo.lock rust-toolchain.toml .cargo src/.sqlx src/server src/agent src/features src/infrastructure src/tools/build src/tools/xtask version.json Dockerfile \
            | docker build --file Dockerfile --target rust-source -

      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: core-checks
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Set up Java for pinned Docker API generation
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify generated Docker API crate
        run: cargo run --locked -p xtask -- docker-api --check

      - name: Verify database schema
        run: cargo run --locked -p xtask -- database verify

      - name: Verify committed OpenAPI artifacts
        run: cargo run --locked -p xtask -- openapi --check

      - name: Check Rust lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  rust-tests:
    if: needs.version.outputs.completed != 'true'
    needs: version
    name: Rust unit and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SQLX_OFFLINE: "true"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_INCREMENTAL: "false"
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - name: Install Rust build prerequisites
        run: |
          bash .github/scripts/install-packages.sh pkg-config libssl-dev
          echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - name: Authenticate Docker Hub pulls
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal

      - name: Cache Rust tests
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: core-tests
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Run Rust workspace tests
        run: cargo test --locked --workspace

      - name: Run real Compose environment isolation test
        run: |
          set -euo pipefail
          # Match the CLI/plugin versions used by test/scripts/test-stack-runtime.sh.
          docker_version=29.0.0
          compose_version=v2.40.3
          tools_dir=$(mktemp -d)
          trap 'rm -rf "$tools_dir"' EXIT
          curl --fail --silent --show-error --location \
            "https://download.docker.com/linux/static/stable/x86_64/docker-${docker_version}.tgz" \
            | tar --extract --gzip --directory "$tools_dir"
          curl --fail --silent --show-error --location \
            "https://github.com/docker/compose/releases/download/${compose_version}/docker-compose-linux-x86_64" \
            --output "$tools_dir/docker-compose"
          # Compose runs with a private HOME/DOCKER_CONFIG, so install the plugin
          # in the disposable runner's system search path, outside auth config.
          sudo install -D -m 0755 "$tools_dir/docker-compose" /usr/local/lib/docker/cli-plugins/docker-compose
          export PATH="$tools_dir/docker:$PATH"
          docker compose version
          compose_env_test=stacks::tests::compose_interpolation_excludes_core_secrets
          compose_env_helper=stacks::tests::compose_environment_helper
          cargo test --locked -p citadel-docker --lib "$compose_env_test" -- --ignored --exact --list | grep -Fx "$compose_env_test: test"
          cargo test --locked -p citadel-docker --lib "$compose_env_helper" -- --exact --list | grep -Fx "$compose_env_helper: test"
          cargo test --locked -p citadel-docker --lib "$compose_env_test" -- --ignored --exact

      - name: Run authorization and runtime database regressions
        run: |
          set -euo pipefail
          container=citadel-authorization-postgres
          trap 'docker rm -f -v "$container" >/dev/null' EXIT
          docker run --detach --name "$container" \
            --publish 127.0.0.1::5432 \
            --env POSTGRES_USER=citadel_test \
            --env POSTGRES_PASSWORD=citadel_test \
            --env POSTGRES_DB=citadel_authorization \
            postgres@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44 \
            -c shared_preload_libraries=pg_stat_statements
          for _ in {1..60}; do
            if docker exec "$container" pg_isready -h 127.0.0.1 -U citadel_test -d citadel_authorization; then
              break
            fi
            sleep 1
          done
          docker exec "$container" psql -h 127.0.0.1 -U citadel_test -d citadel_authorization \
            -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pg_stat_statements'
          port=$(docker port "$container" 5432/tcp | cut -d: -f2)
          export CITADEL_WORKLOAD_DATABASE_URL="postgres://citadel_test:citadel_test@127.0.0.1:$port/citadel_authorization"
          export CITADEL_IDENTITY_DATABASE_URL="$CITADEL_WORKLOAD_DATABASE_URL"
          export CITADEL_PLATFORM_DATABASE_URL="$CITADEL_WORKLOAD_DATABASE_URL"
          export CITADEL_EXECUTION_DATABASE_URL="$CITADEL_WORKLOAD_DATABASE_URL"
          export CITADEL_REQUIRE_QUERY_COUNTS=1
          # The migration checksum test intentionally corrupts its journal.
          docker exec "$container" createdb -h 127.0.0.1 -U citadel_test citadel_migrations
          export CITADEL_TEST_DATABASE_URL="postgres://citadel_test:citadel_test@127.0.0.1:$port/citadel_migrations"
          : "${CITADEL_IDENTITY_DATABASE_URL:?}" "${CITADEL_EXECUTION_DATABASE_URL:?}" "${CITADEL_TEST_DATABASE_URL:?}"
          # Keep workspace feature resolution identical to the unit-test build.
          cargo test --locked --workspace --test deployments_http \
            deployment_endpoints_enforce_auth_and_persist_the_crud_lifecycle -- --ignored --exact --nocapture
          stack_test=stack_endpoints_enforce_auth_and_persist_apply_release_and_delete
          cargo test --locked --workspace --test stacks_http "$stack_test" -- --ignored --exact --list | grep -Fx "$stack_test: test"
          cargo test --locked --workspace --test stacks_http "$stack_test" -- --ignored --exact --test-threads=1
          cargo test --locked --workspace --test identity_authorization_differential -- --ignored --test-threads=1
          cargo test --locked --workspace --test deployment_apply_persistence -- --ignored --test-threads=1
          cargo test --locked --workspace --test stack_persistence --test platform_inventory_persistence -- --ignored --test-threads=1
          cargo test --locked --workspace --test platforms_http -- --ignored --test-threads=1
          cargo test --locked --workspace --test edge_transport -- --ignored --test-threads=1
          cargo test --locked --workspace --test backup_source_discovery -- --ignored --test-threads=1
          cargo test --locked --workspace --test mfa_http --test oidc_http --test users_http --test teams_http --test roles_http -- --ignored --test-threads=1
          cargo test --locked --workspace --test execution_resources_http resource_copies -- --ignored --test-threads=1
          # These ignored fixtures exercise real completion transactions and fault injection.
          for selection in \
            'build_execution build_runs_claim_once_persist_results_cancel_and_recover' \
            'backup_execution backup_claims_are_repository_exclusive_and_late_results_do_not_overwrite_recovery' \
            'alert_persistence durable_observation_recovers_missed_wakes_and_does_not_evaluate_twice_after_ack_failure'; do
            read -r target test_name <<< "$selection"
            # Recovery and receipt consumption inspect shared queues; each fixture
            # gets a fresh execution database, separate from authorization tests.
            docker exec "$container" createdb -h 127.0.0.1 -U citadel_test "citadel_$target"
            (
              export CITADEL_EXECUTION_DATABASE_URL="postgres://citadel_test:citadel_test@127.0.0.1:$port/citadel_$target"
              cargo test --locked --workspace --test "$target" "$test_name" -- --ignored --exact --list | grep -Fx "$test_name: test"
              cargo test --locked --workspace --test "$target" "$test_name" -- --ignored --exact --test-threads=1
            )
          done
          # Inventory changes other fixture connectors: isolate these library tests,
          # and keep execution serial. This does not replace platforms_http above.
          docker exec "$container" createdb -h 127.0.0.1 -U citadel_test citadel_runtime_platforms
          (
            export CITADEL_PLATFORM_DATABASE_URL="postgres://citadel_test:citadel_test@127.0.0.1:$port/citadel_runtime_platforms"
            for test_name in \
              workers::platforms::state_delta_tests::lifecycle_events_use_no_docker_reads_and_unknown_identity_stays_container_scoped \
              workers::platforms::state_delta_tests::local_and_direct_bursts_commit_once_and_publish_six_ids \
              workers::platforms::inventory_tests::daemon_bursts_coalesce_and_events_during_refresh_schedule_one_follow_up; do
              cargo test --locked --workspace --lib "$test_name" -- --ignored --exact --list | grep -Fx "$test_name: test"
              cargo test --locked --workspace --lib "$test_name" -- --ignored --exact --test-threads=1
            done
          )
          cancellation_test=persistence::postgres::identity::authorization_cache::tests::cancelled_commits_preserve_acl_fencing_and_session_notifications
          cargo test --locked -p citadel-adapters --lib "$cancellation_test" -- --ignored --exact --list | grep -F "$cancellation_test: test"
          cargo test --locked -p citadel-adapters --lib "$cancellation_test" -- --ignored --exact --test-threads=1
          cargo test --locked -p citadel-database --test migrations -- --ignored --test-threads=1

  # Preserve the existing required-check name while covering both parallel jobs.
  rust-openapi:
    name: Rust validation
    if: always() && needs.version.result == 'success' && needs.version.outputs.completed != 'true'
    needs: [version, rust-checks, rust-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all Rust checks
        env:
          CHECKS_RESULT: ${{ needs.rust-checks.result }}
          TESTS_RESULT: ${{ needs.rust-tests.result }}
        run: test "$CHECKS_RESULT" = success && test "$TESTS_RESULT" = success

  frontend-tests:
    if: needs.version.outputs.completed != 'true'
    needs: version
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify generated API client
        run: npm run api:verify

      - name: Lint frontend
        run: npm run lint

      - name: Check frontend formatting
        run: npm run prettier:verify

      - name: Check frontend types
        run: npx tsc -b

      - name: Run frontend unit tests
        run: npm run test:run
  candidates:
    if: needs.version.outputs.completed != 'true'
    # Build and test images in parallel; publication still requires every gate.
    needs: version
    permissions:
      contents: write
      packages: read
      actions: read
    uses: ./.github/workflows/agent.yml
    with:
      release: ${{ needs.version.outputs.publication == 'true' }}
      dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  documentation:
    if: needs.version.outputs.completed != 'true'
    name: Validate and retain release documentation
    permissions:
      contents: write
      packages: read
      actions: read
    needs: version
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_DOCS_URL: ${{ vars.DOCS_SITE_URL || 'http://localhost:3000' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-inputs
          path: ${{ runner.temp }}/documentation
      - name: Recover original documentation on retry
        if: needs.version.outputs.publication == 'true'
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 src/tools/release/release.py recover --repository "$GITHUB_REPOSITORY" \
            --metadata "$RUNNER_TEMP/documentation/version.json" --directory "$RUNNER_TEMP/documentation" \
            --artifact release-documentation \
            > "$RUNNER_TEMP/docs-recovery.json"
          echo "recovered=$(jq -r .recovered "$RUNNER_TEMP/docs-recovery.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.recovery.outputs.recovered != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Build and validate static sites from this commit
        if: steps.recovery.outputs.recovered != 'true'
        run: |
          npm ci --prefix docs
          npm run test:config --prefix docs
          npm run validate --prefix docs
          npm run lint --prefix docs
          npm run types:check --prefix docs
          npm run build --prefix docs
          npm run test:static --prefix docs
          npm run build:api --prefix docs
          git diff --exit-code -- schema
          npm run test:api --prefix docs
          tar -cf "$RUNNER_TEMP/documentation/docs.tar" -C docs/out .
          tar -cf "$RUNNER_TEMP/documentation/api-docs.tar" -C docs/api-out .
          python3 - "$RUNNER_TEMP/documentation" <<'PYDOC'
          import hashlib,json,pathlib,sys
          directory=pathlib.Path(sys.argv[1])
          manifest={"metadata":json.loads((directory/'version.json').read_text()),
                    "artifacts":{n:hashlib.sha256((directory/n).read_bytes()).hexdigest() for n in ['docs.tar','api-docs.tar']}}
          (directory/'documentation-inputs.json').write_text(json.dumps(manifest))
          PYDOC
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-documentation
          overwrite: true
          path: |
            ${{ runner.temp }}/documentation/docs.tar
            ${{ runner.temp }}/documentation/api-docs.tar
            ${{ runner.temp }}/documentation/documentation-inputs.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain accepted documentation until publication succeeds
        if: needs.version.outputs.publication == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin "+$GITHUB_REF:$GITHUB_REF"
          python3 src/tools/release/release.py retain-validation --apply --repository "$GITHUB_REPOSITORY" \
            --metadata "$RUNNER_TEMP/documentation/version.json" --directory "$RUNNER_TEMP/documentation" \
            --artifact release-documentation

  publish:
    name: Promote verified product and documentation
    if: needs.version.outputs.release == 'true' && needs.version.outputs.completed != 'true'
    needs: [version, rust-openapi, frontend-tests, candidates, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Hold one global lock through image aliases AND default documentation.
    concurrency:
      group: citadel-product-publication
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.documentation.outputs.url }}
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
      CITADEL_RUST_AGENT_RELEASE_ENABLED: ${{ vars.CITADEL_RUST_AGENT_RELEASE_ENABLED }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
      API_DOCS_URL: ${{ vars.API_DOCS_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Restore annotated release tags
        # Every publishing job has its own checkout; preflight's refs are not shared.
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main '+refs/tags/*:refs/tags/*'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-inputs
          path: ${{ runner.temp }}/promotion
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidates-*
          path: ${{ runner.temp }}/promotion
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-documentation
          path: ${{ runner.temp }}/promotion
      - name: Install OCI transport
        run: bash .github/scripts/install-packages.sh skopeo
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Authenticate registry transport
        run: |
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | skopeo login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Promote recorded Agent then Core and eligible aliases
        run: |
          python3 src/tools/release/release.py promote --apply --repository "$GITHUB_REPOSITORY" \
            --metadata "$RUNNER_TEMP/promotion/version.json" --directory "$RUNNER_TEMP/promotion" \
            > "$RUNNER_TEMP/promotion/result.json"
      - uses: ./.github/actions/publish-docs
        id: documentation
        with:
          directory: ${{ runner.temp }}/promotion
      - name: Finalize durable release record
        env:
          CITADEL_DOCS_RESULT: ${{ steps.documentation.outputs.result }}
        run: |
          python3 src/tools/release/release.py finalize --apply --repository "$GITHUB_REPOSITORY" \
            --metadata "$RUNNER_TEMP/promotion/version.json" --directory "$RUNNER_TEMP/promotion"
      - name: Link product release
        if: always()
        run: |
          echo "Product release (recovery draft retained only while incomplete): https://github.com/$GITHUB_REPOSITORY/releases/tag/v${{ needs.version.outputs.product }}" >> "$GITHUB_STEP_SUMMARY"

  publish-development:
    name: Publish tested development images and documentation
    if: needs.version.outputs.development == 'true' && needs.version.outputs.completed != 'true'
    needs: [version, rust-openapi, frontend-tests, candidates, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: citadel-product-publication
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.documentation.outputs.url }}
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
      CITADEL_RUST_AGENT_RELEASE_ENABLED: ${{ vars.CITADEL_RUST_AGENT_RELEASE_ENABLED }}
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
      API_DOCS_URL: ${{ vars.API_DOCS_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Restore annotated release tags
        # Every publishing job has its own checkout; preflight's refs are not shared.
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main '+refs/tags/*:refs/tags/*'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-inputs
          path: ${{ runner.temp }}/promotion
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidates-*
          path: ${{ runner.temp }}/promotion
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-documentation
          path: ${{ runner.temp }}/promotion
      - name: Install OCI transport
        run: bash .github/scripts/install-packages.sh skopeo
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Authenticate GHCR transport
        run: |
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish retained images and development aliases
        run: |
          python3 src/tools/release/release.py promote --apply --repository "$GITHUB_REPOSITORY" \
            --metadata "$RUNNER_TEMP/promotion/version.json" --directory "$RUNNER_TEMP/promotion"
      - uses: ./.github/actions/publish-docs
        id: documentation
        with:
          directory: ${{ runner.temp }}/promotion
      - name: Finalize durable development release record
        env:
          CITADEL_DOCS_RESULT: ${{ steps.documentation.outputs.result }}
        run: |
          python3 src/tools/release/release.py finalize --apply --repository "$GITHUB_REPOSITORY" \
            --metadata "$RUNNER_TEMP/promotion/version.json" --directory "$RUNNER_TEMP/promotion"
      - name: Link development release
        if: always()
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display }}
        run: |
          echo "Development release (recovery draft retained only while incomplete): https://github.com/$GITHUB_REPOSITORY/releases/tag/v$DISPLAY_VERSION" >> "$GITHUB_STEP_SUMMARY"

  deploy-preview:
    name: Deploy published dev release to preview
    if: always() && !cancelled() && needs.version.result == 'success' && needs.version.outputs.development == 'true' && vars.CITADEL_PREVIEW_DEPLOY_ENABLED == 'true' && (needs.publish-development.result == 'success' || needs.version.outputs.completed == 'true')
    needs: [version, publish-development]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Prevent alias movement throughout deployment and public health verification.
    concurrency:
      group: citadel-product-publication
      cancel-in-progress: false
      queue: max
    environment:
      name: preview
      url: ${{ vars.CITADEL_DEMO_URL }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.revision }}
      - uses: ./.github/actions/deploy-demo
        env:
          GH_TOKEN: ${{ github.token }}
          CITADEL_DEMO_HOST: ${{ vars.CITADEL_DEMO_HOST }}
          CITADEL_DEMO_USER: ${{ vars.CITADEL_DEMO_USER }}
          CITADEL_DEMO_PORT: ${{ vars.CITADEL_DEMO_PORT || '22' }}
          CITADEL_DEMO_DIRECTORY: ${{ vars.CITADEL_DEMO_DIRECTORY }}
          CITADEL_DEMO_URL: ${{ vars.CITADEL_DEMO_URL }}
        with:
          channel: dev
          ssh-key: ${{ secrets.CITADEL_DEMO_SSH_KEY }}
          known-hosts: ${{ secrets.CITADEL_DEMO_KNOWN_HOSTS }}

  deploy-demo-stable:
    name: Deploy published latest release to demo
    if: always() && !cancelled() && needs.version.result == 'success' && needs.version.outputs.release == 'true' && vars.CITADEL_DEMO_DEPLOY_ENABLED == 'true' && (needs.publish.result == 'success' || needs.version.outputs.completed == 'true')
    needs: [version, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Prevent alias movement throughout deployment and public health verification.
    concurrency:
      group: citadel-product-publication
      cancel-in-progress: false
      queue: max
    environment:
      name: demo
      url: ${{ vars.CITADEL_DEMO_URL }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.revision }}
      - uses: ./.github/actions/deploy-demo
        env:
          GH_TOKEN: ${{ github.token }}
          CITADEL_DEMO_HOST: ${{ vars.CITADEL_DEMO_HOST }}
          CITADEL_DEMO_USER: ${{ vars.CITADEL_DEMO_USER }}
          CITADEL_DEMO_PORT: ${{ vars.CITADEL_DEMO_PORT || '22' }}
          CITADEL_DEMO_DIRECTORY: ${{ vars.CITADEL_DEMO_DIRECTORY }}
          CITADEL_DEMO_URL: ${{ vars.CITADEL_DEMO_URL }}
        with:
          channel: latest
          ssh-key: ${{ secrets.CITADEL_DEMO_SSH_KEY }}
          known-hosts: ${{ secrets.CITADEL_DEMO_KNOWN_HOSTS }}
