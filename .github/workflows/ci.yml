name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  version:
    name: Resolve identity and release preflight
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.version.outputs.releaseEligible }}
      product: ${{ steps.version.outputs.productVersion }}
      publication: ${{ steps.version.outputs.publicationEligible }}
      development: ${{ steps.version.outputs.developmentReleaseEligible }}
      display: ${{ steps.version.outputs.displayVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install native tooling prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev skopeo
      - uses: actions/cache@v4
        with:
          path: ~/.cache/citadel-tools
          key: nbgv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/tools/build/nbgv-pin.json', 'rust-toolchain.toml') }}
      - name: Install and verify pinned native NBGV
        run: python3 src/tools/build/version.py install
      - name: Resolve build identity once
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          # checkout may replace the annotated tag ref with the event commit.
          # Restore origin's tag objects in this disposable checkout before validation.
          git fetch origin +refs/heads/main:refs/remotes/origin/main '+refs/tags/*:refs/tags/*'
          mkdir -p "$RUNNER_TEMP/release-inputs"
          python3 src/tools/build/version.py resolve --event "$EVENT" --ref "$REF" --sha "$SHA" \
            --output "$RUNNER_TEMP/release-inputs/version.json" --github-output "$GITHUB_OUTPUT"
      - name: Check version mapping and embedding
        run: CITADEL_TEST_OCI_TRANSPORT=1 python3 -m unittest discover -s test/release -v
      - name: Validate coordinated publication prerequisites
        if: steps.version.outputs.publicationEligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CITADEL_RUST_AGENT_RELEASE_ENABLED: ${{ vars.CITADEL_RUST_AGENT_RELEASE_ENABLED }}
          CITADEL_AGENT_ROLLBACK_IMAGE: ${{ vars.CITADEL_AGENT_ROLLBACK_IMAGE }}
          CITADEL_CORE_ROLLBACK_IMAGE: ${{ vars.CITADEL_CORE_ROLLBACK_IMAGE }}
          CITADEL_FIRST_RUST_RELEASE: ${{ vars.CITADEL_FIRST_RUST_RELEASE }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
          API_DOCS_URL: ${{ vars.API_DOCS_URL }}
        run: |
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if jq -e '.releaseEligible' "$RUNNER_TEMP/release-inputs/version.json" >/dev/null; then
            printf '%s' "$DOCKERHUB_TOKEN" | skopeo login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          fi
          python3 src/tools/release/release.py preflight --repository "$GITHUB_REPOSITORY" \
            --metadata "$RUNNER_TEMP/release-inputs/version.json" --directory "$RUNNER_TEMP/release-inputs" \
            > "$RUNNER_TEMP/release-inputs/compatibility.json"
      - name: Non-publishing validation context
        if: steps.version.outputs.publicationEligible != 'true'
        run: |
          printf '%s\n' '{"bootstrap":false,"agent":null,"core":null,"protocolVersion":2,"architectures":["amd64","arm64"],"agentFirstUpgrades":true}' > "$RUNNER_TEMP/release-inputs/compatibility.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-inputs
          overwrite: true
          path: ${{ runner.temp }}/release-inputs
          if-no-files-found: error
          retention-days: 30

  rust-checks:
    needs: version
    name: Rust lint and generated contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    env:
      SQLX_OFFLINE: "true"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_INCREMENTAL: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Rust build prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev ripgrep
          echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - name: Verify Rust source ownership
        run: bash test/scripts/check-source-ownership.sh

      - name: Verify Docker build context isolation
        run: |
          set -euo pipefail
          tar -c Cargo.toml Cargo.lock rust-toolchain.toml .cargo src/.sqlx src/server src/agent src/features src/infrastructure src/tools/build src/tools/xtask version.json Dockerfile \
            | docker build --file Dockerfile --target rust-source -

      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-checks
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Set up Java for pinned Docker API generation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify generated Docker API crate
        run: cargo run --locked -p xtask -- docker-api --check

      - name: Verify database schema
        run: cargo run --locked -p xtask -- database verify

      - name: Verify committed OpenAPI artifacts
        run: cargo run --locked -p xtask -- openapi --check

      - name: Check Rust lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  rust-tests:
    needs: version
    name: Rust unit and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SQLX_OFFLINE: "true"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_INCREMENTAL: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Rust build prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
          echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal

      - name: Cache Rust tests
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-tests
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Run Rust workspace tests
        run: cargo test --locked --workspace

      - name: Run authorization and runtime database regressions
        run: |
          set -euo pipefail
          container=citadel-authorization-postgres
          trap 'docker rm -f -v "$container" >/dev/null' EXIT
          docker run --detach --name "$container" \
            --publish 127.0.0.1::5432 \
            --env POSTGRES_USER=citadel_test \
            --env POSTGRES_PASSWORD=citadel_test \
            --env POSTGRES_DB=citadel_authorization \
            postgres@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44 \
            -c shared_preload_libraries=pg_stat_statements
          for _ in {1..60}; do
            if docker exec "$container" pg_isready -h 127.0.0.1 -U citadel_test -d citadel_authorization; then
              break
            fi
            sleep 1
          done
          docker exec "$container" psql -h 127.0.0.1 -U citadel_test -d citadel_authorization \
            -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pg_stat_statements'
          port=$(docker port "$container" 5432/tcp | cut -d: -f2)
          export CITADEL_WORKLOAD_DATABASE_URL="postgres://citadel_test:citadel_test@127.0.0.1:$port/citadel_authorization"
          export CITADEL_IDENTITY_DATABASE_URL="$CITADEL_WORKLOAD_DATABASE_URL"
          export CITADEL_PLATFORM_DATABASE_URL="$CITADEL_WORKLOAD_DATABASE_URL"
          export CITADEL_EXECUTION_DATABASE_URL="$CITADEL_WORKLOAD_DATABASE_URL"
          export CITADEL_REQUIRE_QUERY_COUNTS=1
          # Keep workspace feature resolution identical to the unit-test build.
          cargo test --locked --workspace --test deployments_http \
            deployment_endpoints_enforce_auth_and_persist_the_crud_lifecycle -- --ignored --exact --nocapture
          cargo test --locked --workspace --test identity_authorization_differential -- --ignored --test-threads=1
          cargo test --locked --workspace --test deployment_apply_persistence -- --ignored --test-threads=1
          cargo test --locked --workspace --test stack_persistence --test platform_inventory_persistence -- --ignored --test-threads=1
          cargo test --locked --workspace --test platforms_http -- --ignored --test-threads=1
          cargo test --locked --workspace --test edge_transport -- --ignored --test-threads=1

  # Preserve the existing required-check name while covering both parallel jobs.
  rust-openapi:
    name: Rust validation
    if: always() && needs.version.result == 'success'
    needs: [version, rust-checks, rust-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all Rust checks
        env:
          CHECKS_RESULT: ${{ needs.rust-checks.result }}
          TESTS_RESULT: ${{ needs.rust-tests.result }}
        run: test "$CHECKS_RESULT" = success && test "$TESTS_RESULT" = success

  frontend-tests:
    needs: version
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify generated API client
        run: npm run api:verify

      - name: Check frontend types
        run: npx tsc -b

      - name: Run frontend unit tests
        run: npm run test:run
  candidates:
    # Build and test images in parallel; publication still requires every gate.
    needs: version
    uses: ./.github/workflows/agent.yml
    with:
      release: ${{ needs.version.outputs.publication == 'true' }}

  documentation:
    name: Validate and retain release documentation
    needs: version
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_DOCS_URL: ${{ vars.DOCS_SITE_URL || 'http://localhost:3000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: ${{ runner.temp }}/documentation
      - name: Recover original documentation on retry
        if: needs.version.outputs.publication == 'true'
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 src/tools/release/release.py recover --repository "$GITHUB_REPOSITORY" \
            --metadata "$RUNNER_TEMP/documentation/version.json" --directory "$RUNNER_TEMP/documentation" \
            --artifact release-documentation \
            > "$RUNNER_TEMP/docs-recovery.json"
          echo "recovered=$(jq -r .recovered "$RUNNER_TEMP/docs-recovery.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.recovery.outputs.recovered != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Build and validate static sites from this commit
        if: steps.recovery.outputs.recovered != 'true'
        run: |
          npm ci --prefix docs
          npm run test:config --prefix docs
          npm run validate --prefix docs
          npm run lint --prefix docs
          npm run types:check --prefix docs
          npm run build --prefix docs
          npm run test:static --prefix docs
          npm run build:api --prefix docs
          git diff --exit-code -- schema
          npm run test:api --prefix docs
          tar -cf "$RUNNER_TEMP/documentation/docs.tar" -C docs/out .
          tar -cf "$RUNNER_TEMP/documentation/api-docs.tar" -C docs/api-out .
          python3 - "$RUNNER_TEMP/documentation" <<'PYDOC'
          import hashlib,json,pathlib,sys
          directory=pathlib.Path(sys.argv[1])
          manifest={"metadata":json.loads((directory/'version.json').read_text()),
                    "artifacts":{n:hashlib.sha256((directory/n).read_bytes()).hexdigest() for n in ['docs.tar','api-docs.tar']}}
          (directory/'documentation-inputs.json').write_text(json.dumps(manifest))
          PYDOC
      - uses: actions/upload-artifact@v4
        with:
          name: release-documentation
          overwrite: true
          path: |
            ${{ runner.temp }}/documentation/docs.tar
            ${{ runner.temp }}/documentation/api-docs.tar
            ${{ runner.temp }}/documentation/documentation-inputs.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Promote verified product and documentation
    if: needs.version.outputs.release == 'true'
    needs: [version, rust-openapi, frontend-tests, candidates, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Hold one global lock through image aliases AND default documentation.
    concurrency:
      group: citadel-product-publication
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
      CITADEL_RUST_AGENT_RELEASE_ENABLED: ${{ vars.CITADEL_RUST_AGENT_RELEASE_ENABLED }}
      CITADEL_AGENT_ROLLBACK_IMAGE: ${{ vars.CITADEL_AGENT_ROLLBACK_IMAGE }}
      CITADEL_CORE_ROLLBACK_IMAGE: ${{ vars.CITADEL_CORE_ROLLBACK_IMAGE }}
      CITADEL_FIRST_RUST_RELEASE: ${{ vars.CITADEL_FIRST_RUST_RELEASE }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
      API_DOCS_URL: ${{ vars.API_DOCS_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore annotated release tags
        # Every publishing job has its own checkout; preflight's refs are not shared.
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main '+refs/tags/*:refs/tags/*'
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: ${{ runner.temp }}/promotion
      - uses: actions/download-artifact@v4
        with:
          pattern: candidates-*
          path: ${{ runner.temp }}/promotion
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-documentation
          path: ${{ runner.temp }}/promotion
      - name: Install OCI transport
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: sigstore/cosign-installer@v3
      - name: Authenticate registry transport
        run: |
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | skopeo login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Promote recorded Agent then Core and eligible aliases
        run: |
          python3 src/tools/release/release.py promote --apply --repository "$GITHUB_REPOSITORY" \
            --metadata "$RUNNER_TEMP/promotion/version.json" --directory "$RUNNER_TEMP/promotion" \
            > "$RUNNER_TEMP/promotion/result.json"
      - name: Check default documentation version ordering
        id: docs
        run: |
          python3 src/tools/release/release.py docs --repository "$GITHUB_REPOSITORY" \
            --metadata "$RUNNER_TEMP/promotion/version.json" --directory "$RUNNER_TEMP/promotion" >> "$GITHUB_OUTPUT"
      - name: Restore the verified documentation artifact
        if: steps.docs.outputs.eligible == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar -xf "$RUNNER_TEMP/promotion/docs.tar" -C "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        if: steps.docs.outputs.eligible == 'true'
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy eligible stable documentation
        id: deployment
        if: steps.docs.outputs.eligible == 'true'
        uses: actions/deploy-pages@v4
      - name: Finalize durable release record
        env:
          CITADEL_DOCS_RESULT: ${{ steps.docs.outputs.eligible == 'true' && steps.deployment.outputs.page_url || 'skipped-older-release' }}
        run: |
          python3 src/tools/release/release.py finalize --apply --repository "$GITHUB_REPOSITORY" \
            --metadata "$RUNNER_TEMP/promotion/version.json" --directory "$RUNNER_TEMP/promotion"
      - name: Link recovery record even after failure
        if: always()
        run: |
          echo "Release/recovery record: https://github.com/$GITHUB_REPOSITORY/releases/tag/v${{ needs.version.outputs.product }}" >> "$GITHUB_STEP_SUMMARY"

  publish-development:
    name: Publish tested development images
    if: needs.version.outputs.development == 'true'
    needs: [version, rust-openapi, frontend-tests, candidates, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: citadel-product-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      CITADEL_RUST_AGENT_RELEASE_ENABLED: ${{ vars.CITADEL_RUST_AGENT_RELEASE_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore annotated release tags
        # Every publishing job has its own checkout; preflight's refs are not shared.
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main '+refs/tags/*:refs/tags/*'
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: ${{ runner.temp }}/promotion
      - uses: actions/download-artifact@v4
        with:
          pattern: candidates-*
          path: ${{ runner.temp }}/promotion
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-documentation
          path: ${{ runner.temp }}/promotion
      - name: Install OCI transport
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: sigstore/cosign-installer@v3
      - name: Authenticate GHCR transport
        run: printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish retained images and development aliases
        run: |
          python3 src/tools/release/release.py promote --apply --repository "$GITHUB_REPOSITORY" \
            --metadata "$RUNNER_TEMP/promotion/version.json" --directory "$RUNNER_TEMP/promotion"
          python3 src/tools/release/release.py finalize --apply --repository "$GITHUB_REPOSITORY" \
            --metadata "$RUNNER_TEMP/promotion/version.json" --directory "$RUNNER_TEMP/promotion"
      - name: Link development release and recovery record
        if: always()
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display }}
        run: echo "Development release/recovery record https://github.com/$GITHUB_REPOSITORY/releases/tag/v$DISPLAY_VERSION" >> "$GITHUB_STEP_SUMMARY"

  deploy-demo:
    name: Deploy published development release to demo
    if: needs.version.outputs.development == 'true' && vars.CITADEL_DEMO_DEPLOY_ENABLED == 'true'
    needs: [version, publish-development]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The VPS lock serializes deployments without discarding queued versions.
    environment:
      name: demo
      url: ${{ vars.CITADEL_DEMO_URL }}
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CITADEL_DEMO_HOST: ${{ vars.CITADEL_DEMO_HOST }}
      CITADEL_DEMO_USER: ${{ vars.CITADEL_DEMO_USER }}
      CITADEL_DEMO_PORT: ${{ vars.CITADEL_DEMO_PORT || '22' }}
      CITADEL_DEMO_DIRECTORY: ${{ vars.CITADEL_DEMO_DIRECTORY }}
      CITADEL_DEMO_URL: ${{ vars.CITADEL_DEMO_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: ${{ runner.temp }}/demo
      - name: Configure pinned SSH identity
        env:
          SSH_KEY: ${{ secrets.CITADEL_DEMO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CITADEL_DEMO_KNOWN_HOSTS }}
        run: |
          umask 077
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          mkdir -p "$RUNNER_TEMP/demo-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/demo-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/demo-ssh/known_hosts"
      - name: Deploy recorded digests and verify demo health
        run: |
          python3 src/tools/release/demo.py --apply --repository "$GITHUB_REPOSITORY" \
            --metadata "$RUNNER_TEMP/demo/version.json" \
            --identity "$RUNNER_TEMP/demo-ssh/key" --known-hosts "$RUNNER_TEMP/demo-ssh/known_hosts"
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/demo-ssh"
