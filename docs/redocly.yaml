extends:
  - recommended

apis:
  citadel@preview:
    root: ../schema/public-v1.json

rules:
  info-license: off
  operation-description: off
  operation-4xx-response: warn
  tag-description: off
  no-server-example.com: off
  # Self-hosted deployments supply their own API origin.
  no-empty-servers: off
  # Current Rust handlers use id/deploymentId and id/stackId for different
  # methods on the same URL. Keep the warning visible without blocking docs.
  no-identical-paths: warn
  no-unused-components: error
  # Static channel routes take precedence over resource ID routes; OpenAPI
  # cannot express the UUID validation used at the request boundary.
  no-ambiguous-paths: off
