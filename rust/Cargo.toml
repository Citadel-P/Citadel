[workspace]
resolver = "3"
members = [
    "crates/server",
    "crates/features/activities",
    "crates/features/alerts",
    "crates/features/application",
    "crates/features/automation",
    "crates/features/backups",
    "crates/features/bindings",
    "crates/features/builds",
    "crates/features/deployments",
    "crates/features/discovery",
    "crates/features/execution",
    "crates/features/git",
    "crates/features/identity",
    "crates/features/licensing",
    "crates/features/platforms",
    "crates/features/primitives",
    "crates/features/registries",
    "crates/features/stacks",
    "crates/features/swarm-services",
    "crates/features/tags",
    "crates/infrastructure/adapters",
    "crates/infrastructure/contracts",
    "crates/infrastructure/database",
    "crates/infrastructure/docker-api",
    "crates/infrastructure/processes",
    "crates/infrastructure/runtime",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/citadel-p/citadel"

[workspace.dependencies]
utoipa = { version = "=5.5.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "=0.2.0"
utoipa-swagger-ui = { version = "=9.0.2", features = ["axum", "vendored"] }
aes-gcm = { version = "=0.10.3", features = ["std", "zeroize"] }
async-stream = "=0.3.6"
async-trait = "=0.1.92"
argon2 = { version = "=0.5.3", features = ["std", "zeroize"] }
axum = { version = "=0.8.9", features = ["ws"] }
axum-server = { version = "=0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "=0.23.1"
bytes = "=1.12.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "=0.10.4"
clap = { version = "=4.6.6", features = ["derive"] }
ed25519-dalek = { version = "=3.0.0", features = ["pem", "pkcs8"] }
email_address = "=0.2.9"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
hmac = "=0.13.0"
ipnet = "=2.11.0"
jsonwebtoken = { version = "=10.2.0", default-features = false, features = ["rust_crypto"] }
prost = "=0.14.4"
prost-types = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
rustix = { version = "=1.1.4", features = ["fs"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_repr = "=0.1.21"
serde_with = { version = "=3.23.0", default-features = false, features = ["std"] }
serde_path_to_error = "=0.1.20"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.0"
sha1 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["chrono", "macros", "postgres", "runtime-tokio", "uuid"] }
subtle = "=2.6.1"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "=0.1.19"
tokio-util = { version = "=0.7.19", features = ["rt"] }
tower = { version = "=0.5.3", features = ["util"] }
tonic = { version = "=0.14.6", default-features = false, features = ["channel", "codegen", "transport"] }
tonic-prost = "=0.14.6"
tonic-prost-build = { version = "=0.14.6", default-features = false, features = ["transport"] }
tower-http = { version = "=0.7.0", features = ["catch-panic", "cors", "fs", "limit", "request-id", "set-header", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake"] }
urlencoding = "=2.1.3"
url = "=2.5.8"
uuid = { version = "=1.24.1", features = ["serde", "v7"] }
zeroize = "=1.8.2"

# Keep full variable/type debugging for Citadel's development crates, without
# embedding the dependency graph's debug information in every executable.
[profile.dev.package."*"]
debug = false

# Test executables need useful backtraces, not full interactive debug data.
[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"
