[advisories]
# Owner: @7amou3 (repository CODEOWNER).
# zip 3.0.0 is solely utoipa-swagger-ui 9.0.2's build dependency. Citadel enables
# vendored Swagger assets; production code accepts no ZIP input. Upstream's
# build.rs uses by_index + enclosed_name + io::copy, not ZipArchive::extract or
# ZipStreamReader::extract. Archive bytes are the pinned vendored crate, not user
# uploads. No archive symlinks are created. It does preserve Unix modes, so build
# asset provenance remains required. These exceptions are not permission to
# extract untrusted ZIPs or override SWAGGER_UI_DOWNLOAD_URL in release builds.
# Rationale: the fixed zip 9 requires a Swagger/utoipa major-version migration;
# no compatible Swagger 9 patch is published. Keep this cleanup API-preserving.
# Review when a compatible Swagger fix is released, when adopting utoipa 6, or
# whenever Swagger asset provenance/extraction changes; review by 2026-11-19.
ignore = [
    "RUSTSEC-2026-0367", # SUID/SGID preservation; trusted build assets only.
    "RUSTSEC-2026-0368", # Archive-created escaping symlinks; API not used.
    "RUSTSEC-2026-0369", # chmod through archive symlinks; API not used.
]
