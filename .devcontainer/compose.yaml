services:
  workspace:
    image: mcr.microsoft.com/devcontainers/rust:1-bookworm
    init: true
    command: sleep infinity
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://citadel:citadel@postgres:5432/citadel
      Transport__Mode: Disabled
      Transport__PublicUrl: http://localhost:8000
      Cors__0: http://localhost:5173
      Cors__1: http://127.0.0.1:5173
      Jwt__Key: citadel-development-jwt-key-at-least-32-bytes
      Secrets__EncryptionKey: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
      CITADEL_RUST_DOCKER_SOCKET: /var/run/docker.sock
      CITADEL_DATA_ROOT: /home/vscode/.local/share/citadel
      CARGO_TARGET_DIR: /home/vscode/.cache/citadel-target
      SQLX_OFFLINE: "true"
      RUST_BACKTRACE: "1"
      RUST_LOG: citadel_server=debug,citadel_adapters=info
      VITE_API_BASE_URL: http://localhost:8000
      # Windows bind mounts do not reliably forward file-change events to Vite.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ..:/workspace:cached
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - rust-target:/home/vscode/.cache/citadel-target
      - npm-cache:/home/vscode/.npm
      - citadel-data:/home/vscode/.local/share/citadel
      - type: volume
        source: frontend-node-modules
        target: /workspace/src/Citadel.FrontEnd/node_modules
        volume:
          nocopy: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    labels:
      com.citadel.system: "true"
      com.citadel.system-role: rust-development

  postgres:
    image: postgres@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44
    restart: unless-stopped
    environment:
      POSTGRES_USER: citadel
      POSTGRES_PASSWORD: citadel
      POSTGRES_DB: citadel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citadel -d citadel"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql
    labels:
      com.citadel.system: "true"
      com.citadel.system-role: development-database

volumes:
  cargo-registry:
  cargo-git:
  rust-target:
  npm-cache:
  citadel-data:
  frontend-node-modules:
  postgres-data:
