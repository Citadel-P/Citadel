syntax = "proto3";
package citadel.automation.v1;
import "google/protobuf/empty.proto";
service AutomationService {
  rpc CheckHost(google.protobuf.Empty) returns (AutomationHost);
  rpc Run(AutomationRequest) returns (stream AutomationEvent);
  rpc Reconcile(AutomationAttempt) returns (AutomationCleanup);
}
message AutomationHost {
  string daemon_id = 1;
  string authority_id = 2;
  uint64 generation = 3;
  uint32 slots = 4;
  uint32 occupied = 5;
  uint32 heavy_slots = 6;
}
message AutomationAttempt {
  string run_id = 1;
  string attempt_id = 2;
  string authority_id = 3;
  uint64 generation = 4;
}
message AutomationRequest {
  AutomationAttempt attempt = 1;
  string source = 2;
  string token = 3;
  string args_json = 4;
  string core_url = 5;
  uint32 timeout_seconds = 6;
  uint32 maximum_log_bytes = 7;
}
message AutomationEvent {
  // Only a definitive refusal before execution permits rescheduling.
  bool not_started = 1;
  string stream = 2;
  bool completed = 3;
  string status = 4;
  optional int32 exit_code = 5;
  string logs = 6;
  optional string error = 7;
}
message AutomationCleanup { bool confirmed = 1; }
