# Published-image installation. Download this file and .env.example as .env.
name: ${COMPOSE_PROJECT_NAME:-citadel}

services:
  server:
    image: ${CITADEL_IMAGE:-ghcr.io/citadel-p/citadel:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
    environment:
      CITADEL_UPDATE_STATE_DIRECTORY: /var/lib/citadel-updates
      CITADEL_HTTP_LISTEN_PORT: "${CITADEL_HTTP_LISTEN_PORT:-8000}"
      CITADEL_EDGE_GRPC_LISTEN_PORT: "${CITADEL_EDGE_GRPC_LISTEN_PORT:-8001}"
      CITADEL_TRANSPORT_MODE: ${CITADEL_TRANSPORT_MODE:-Disabled}
      CITADEL_PUBLIC_URL: ${CITADEL_PUBLIC_URL:-http://localhost:${CITADEL_HTTP_PORT:-18000}}
      CITADEL_EDGE_PUBLIC_GRPC_URL: ${CITADEL_EDGE_PUBLIC_GRPC_URL:-http://localhost:${CITADEL_EDGE_PORT:-18001}}
      CITADEL_HTTP_ALLOWED_HOSTS: ${CITADEL_HTTP_ALLOWED_HOSTS:-localhost;127.0.0.1}
      PG_USER: ${PG_USER:-citadel}
      PG_DATABASE: ${PG_DATABASE:-citadel}
      PG_HOST: ${PG_HOST:-pg_db}
      PG_PORT: "${PG_PORT:-5432}"
    depends_on:
      pg_db:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
      - citadel_data:/app/data
      - ./.citadel-updates:/var/lib/citadel-updates:ro
    ports:
      - "${CITADEL_BIND_ADDRESS:-127.0.0.1}:${CITADEL_HTTP_PORT:-18000}:${CITADEL_HTTP_LISTEN_PORT:-8000}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/citadel-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

  pg_db:
    image: ${PG_IMAGE:-postgres@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f}
    entrypoint:
      - /bin/bash
      - -ec
      - |
        refuse() { echo "Citadel requires a dedicated PostgreSQL 19 volume at /var/lib/postgresql/19/docker. Inspect and preserve existing storage." >&2; exit 1; }
        [[ $$PG_MAJOR == 19 && $$PGDATA == /var/lib/postgresql/19/docker ]] || refuse
        cd /var/lib/postgresql
        shopt -s nullglob dotglob
        for path in * 19/*; do
          [[ ( $$path == 19 || $$path == 19/docker ) && -d $$path && ! -L $$path && -r $$path && -x $$path ]] || refuse
        done
        contents=(19/docker/*)
        if (($${#contents[@]})); then
          [[ -f 19/docker/PG_VERSION && ! -L 19/docker/PG_VERSION ]] && cmp -s 19/docker/PG_VERSION <(printf '19\n') || refuse
        fi
        exec docker-entrypoint.sh "$$@"
      - --
    command: ["postgres", "-c", "shared_buffers=128MB"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-citadel}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
      POSTGRES_DB: ${PG_DATABASE:-citadel}
      PGDATA: ${PG_DATA:-/var/lib/postgresql/19/docker}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      com.citadel.system: "true"
      com.citadel.system-role: "database"

volumes:
  citadel_data:
    labels:
      com.citadel.system: "true"
      com.citadel.system-role: "core"
  postgres_data:
    labels:
      com.citadel.system: "true"
      com.citadel.system-role: "database"
