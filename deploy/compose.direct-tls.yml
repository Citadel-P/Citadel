# Run from the installation directory:
# docker compose -f docker-compose.yml -f compose.direct-tls.yml up -d
# Configure HTTPS public origins and certificate/key paths in .env.
services:
  server:
    environment:
      CITADEL_TRANSPORT_MODE: Direct
    volumes:
      - type: bind
        source: ${CITADEL_TLS_HOST_DIRECTORY:-./tls}
        target: /etc/citadel/tls
        read_only: true
        bind:
          create_host_path: false
