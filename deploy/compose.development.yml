# Overlay on .devcontainer/compose.yaml and compose.wsl.yaml; use dev.sh compose-up.
# Core mounts a staged executable outside Cargo's disposable target directory.
# Keep the existing citadel-wsl PostgreSQL service and volume.
services:
  core:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime-base
    restart: unless-stopped
    user: "${CITADEL_DEV_UID:?}:${CITADEL_DEV_GID:?}"
    group_add:
      - "${CITADEL_DEV_DOCKER_GID:?}"
      - "0"
    env_file:
      - path: ../deploy/.env.development
        format: raw
    environment:
      DATABASE_URL: postgres://citadel:citadel@postgres:5432/citadel
      CITADEL_RUST_DOCKER_SOCKET: /var/run/docker.sock
      DOCKER_HOST: unix:///var/run/docker.sock
      CITADEL_DATA_ROOT: "${CITADEL_DATA_ROOT:?}"
    ports:
      - "127.0.0.1:8000:8000"
      - "${CITADEL_DEV_EDGE_BIND_ADDRESS:-127.0.0.1}:8001:8001"
    volumes:
      - type: bind
        source: "${CITADEL_DEV_BINARY:?}"
        target: /app/citadel-server
        read_only: true
        bind:
          create_host_path: false
      # Preserve signing keys and runtime paths used by Docker bind mounts.
      - type: bind
        source: "${CITADEL_DATA_ROOT:?}"
        target: "${CITADEL_DATA_ROOT:?}"
        bind:
          create_host_path: false
      - type: bind
        source: "${CITADEL_RUST_DOCKER_SOCKET:?}"
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - /:/host:ro
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    labels:
      com.citadel.system: "true"
      com.citadel.system-role: core
