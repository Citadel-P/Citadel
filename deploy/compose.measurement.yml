# Isolated measurement fixture; never use for persistent deployments.
name: citadel-measurement

services:
  measurement-postgres:
    image: postgres@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44
    container_name: citadel-rust-measurement-postgres
    environment:
      POSTGRES_USER: citadel_measurement
      POSTGRES_PASSWORD: citadel_measurement
      POSTGRES_DB: citadel_measurement
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citadel_measurement -d citadel_measurement"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - measurement_postgres:/var/lib/postgresql
    labels:
      com.citadel.system: "true"
      com.citadel.system-role: "measurement-database"

  measurement-server:
    image: ${CITADEL_MEASUREMENT_IMAGE:-citadel-measurement:local}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: citadel-rust-measurement
    depends_on:
      measurement-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://citadel_measurement:citadel_measurement@measurement-postgres:5432/citadel_measurement
      Transport__Mode: Disabled
      Jwt__Key: measurement-only-jwt-key-at-least-32-bytes
      Secrets__EncryptionKey: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
      RUST_LOG: citadel_server=info,citadel_adapters=info
      CITADEL_RUST_DB_MAX_CONNECTIONS: "5"
      CITADEL_RUST_EVENT_QUEUE_CAPACITY: "256"
      JobConfiguration__MonitoringInterval: "10"
    ports:
      - "18000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 100m
    memswap_limit: 100m
    stop_grace_period: 15s
    restart: unless-stopped
    labels:
      com.citadel.system: "true"
      com.citadel.system-role: "measurement-core"

volumes:
  measurement_postgres:

networks:
  default:
    name: citadel-measurement
