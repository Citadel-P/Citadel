# Isolated measurement fixture; never use for persistent deployments.
name: citadel-measurement

services:
  measurement-postgres:
    image: postgres@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
    entrypoint:
      - /bin/bash
      - -ec
      - |
        refuse() { echo "Citadel requires a dedicated PostgreSQL 19 volume at /var/lib/postgresql/19/docker. Inspect and preserve existing storage." >&2; exit 1; }
        [[ $$PG_MAJOR == 19 && $$PGDATA == /var/lib/postgresql/19/docker ]] || refuse
        cd /var/lib/postgresql
        shopt -s nullglob dotglob
        for path in * 19/*; do
          [[ ( $$path == 19 || $$path == 19/docker ) && -d $$path && ! -L $$path ]] || refuse
        done
        if [[ -e 19 ]]; then
          [[ -f 19/docker/PG_VERSION && ! -L 19/docker/PG_VERSION ]] && cmp -s 19/docker/PG_VERSION <(printf '19\n') || refuse
        fi
        exec docker-entrypoint.sh "$$@"
      - --
    command: ["postgres"]
    container_name: citadel-rust-measurement-postgres
    environment:
      POSTGRES_USER: citadel_measurement
      POSTGRES_PASSWORD: citadel_measurement
      POSTGRES_DB: citadel_measurement
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citadel_measurement -d citadel_measurement"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - measurement_postgres:/var/lib/postgresql
    labels:
      com.citadel.system: "true"
      com.citadel.system-role: "measurement-database"

  measurement-server:
    image: ${CITADEL_MEASUREMENT_IMAGE:-citadel-measurement:local}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: citadel-rust-measurement
    depends_on:
      measurement-postgres:
        condition: service_healthy
    environment:
      CITADEL_DATABASE_URL: postgres://citadel_measurement:citadel_measurement@measurement-postgres:5432/citadel_measurement
      CITADEL_TRANSPORT_MODE: Disabled
      CITADEL_JWT_KEY: measurement-only-jwt-key-at-least-32-bytes
      CITADEL_SECRETS_ENCRYPTION_KEY: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
      RUST_LOG: citadel_server=info,citadel_adapters=info
      CITADEL_DATABASE_MAX_CONNECTIONS: "5"
      CITADEL_EVENT_QUEUE_CAPACITY: "256"
      CITADEL_STATS_POLL_INTERVAL_SECONDS: "10"
    ports:
      - "18000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 100m
    memswap_limit: 100m
    stop_grace_period: 15s
    restart: unless-stopped
    labels:
      com.citadel.system: "true"
      com.citadel.system-role: "measurement-core"

volumes:
  measurement_postgres:

networks:
  default:
    name: citadel-measurement
