services:
  server:
    image: citadel.dev
    build:
      context: .
      dockerfile: src/Citadel.WebApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Transport__Mode: Disabled
      Transport__PublicUrl: http://localhost:8000
      EdgeAgent__PublicGrpcUrl: http://localhost:8001
      Transport__ForwardedHeaders__KnownProxies: ""
      Transport__ForwardedHeaders__KnownNetworks: ""
      Transport__ForwardedHeaders__ForwardLimit: ""
      Transport__Certificate__Path: ""
      Transport__Certificate__PrivateKeyPath: ""
      AgentTransport__AllowInsecure: "true"
      AllowedHosts: "localhost;host.docker.internal"
    ports:
      - "8000:8000"
      - "8001:8001"

  pg_db:
    ports:
      - "5432:5432" # Allows to use local DB tools during dev
