services:
  server:
    image: ghcr.io/citadel-p/citadel:${CITADEL_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      ConnectionStrings__Postgres: "Host=pg_db;Database=citadel_db;Username=admin;Password=admin"
    depends_on:
      pg_db:
          condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - citadel_data:/app/data
    ports:
      - "8000:8000" # API
      - "8001:8001" # Grpc

  pg_db:
    image: postgres:alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
        interval: 5s
        retries: 5

volumes:
  citadel_data:
  postgres_data: